<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMBA WORLD MODEL - BATTLE ARENA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        #arena {
            flex: 1;
            position: relative;
            background: #0a0a0f;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
        }

        #sidebar {
            width: 400px;
            background: #111122;
            border-left: 2px solid #00ffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
        }

        .panel {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .panel h3 {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid #00ffff;
            padding-bottom: 5px;
        }

        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px;
            margin: 5px 0;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
        }

        button.danger {
            background: #ff4444;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: #00000033;
            padding: 10px;
            border-left: 3px solid #00ffff;
        }

        .stat.red {
            border-left-color: #ff4444;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        #neuron-map {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 10px 0;
        }

        .neuron {
            aspect-ratio: 1;
            background: #000;
            border-radius: 2px;
        }

        #fps {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #000000aa;
            padding: 5px 10px;
            border-radius: 4px;
            color: #00ff00;
        }

        #status {
            position: absolute;
            top: 10px;
            right: 420px;
            background: #000000aa;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #00ffff;
        }

        .agent-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .agent-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin: 5px 0;
            background: #00000033;
            border-radius: 4px;
            cursor: pointer;
        }

        .agent-item:hover {
            background: #00ffff22;
        }

        .agent-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .agent-hp {
            width: 80px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 4px;
        }

        .agent-hp-fill {
            height: 100%;
            background: #00ff88;
        }
    </style>
</head>
<body>
    <div id="arena">
        <canvas id="canvas"></canvas>
        <div id="fps">FPS: 60</div>
        <div id="status">⏸ PAUSED</div>
    </div>

    <div id="sidebar">
        <div class="panel">
            <h3>⚔️ CONTROL</h3>
            <button id="startBtn" onclick="toggleRun()">🚀 START MAMBA</button>
            <button class="danger" onclick="reset()">🔄 RESET</button>
            <button onclick="togglePause()">⏸ PAUSE</button>
            <label>Speed: <input type="range" id="speed" min="1" max="10" value="1" style="width:100%"></label>
        </div>

        <div class="panel">
            <h3>📊 STATS</h3>
            <div class="stats">
                <div class="stat">
                    <div>GREEN</div>
                    <div class="stat-value" id="greenCount">0</div>
                </div>
                <div class="stat red">
                    <div>RED</div>
                    <div class="stat-value" id="redCount">0</div>
                </div>
                <div class="stat">
                    <div>GEN</div>
                    <div class="stat-value" id="gen">1</div>
                </div>
                <div class="stat">
                    <div>BEST</div>
                    <div class="stat-value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>🧠 MAMBA STATE</h3>
            <div id="neuron-map"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px">
                <div>Δ: <span id="delta">0.00</span></div>
                <div>A: <span id="aNorm">0.00</span></div>
                <div>B: <span id="bNorm">0.00</span></div>
                <div>loss: <span id="loss">0.00</span></div>
            </div>
        </div>

        <div class="panel">
            <h3>👁️ ACTIONS</h3>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; text-align:center">
                <div>↑<br><span id="act0">0.00</span></div>
                <div>↓<br><span id="act1">0.00</span></div>
                <div>←<br><span id="act2">0.00</span></div>
                <div>→<br><span id="act3">0.00</span></div>
                <div>⚡<br><span id="act4">0.00</span></div>
                <div>❤️<br><span id="act5">0.00</span></div>
                <div>🏃<br><span id="act6">0.00</span></div>
                <div>🛡️<br><span id="act7">0.00</span></div>
            </div>
        </div>

        <div class="panel">
            <h3>👥 AGENTS</h3>
            <div class="agent-list" id="agentList"></div>
        </div>
    </div>

    <script>
        // ======================================================================
        // КОНФИГ
        // ======================================================================
        const CONFIG = {
            WIDTH: 1200,
            HEIGHT: 800,
            POPULATION: 4,
            AGENT_RADIUS: 12,
            AGENT_SPEED: 3,
            MAX_HP: 100,
            VIEW_DIST: 250,
            FRICTION: 0.95,
            BULLET_SPEED: 8,
            SHOOT_COOLDOWN: 20,
            DAMAGE: 15,
            HEAL: 20,
            OBS_DIM: 6,
            LATENT_DIM: 32,
            SSM_DIM: 16,
            ACTION_DIM: 8,
            MUTATION_RATE: 0.1,
            MUTATION_STRENGTH: 0.2
        };

        // ======================================================================
        // MAMBA CORE - ПРОСТАЯ РАБОЧАЯ ВЕРСИЯ
        // ======================================================================
        class MambaCore {
            constructor() {
                this.dModel = CONFIG.LATENT_DIM;  // 32
                this.dState = CONFIG.SSM_DIM;      // 16
                
                // Инициализация ВСЕХ матриц с числами
                this.A = []; // [16x16] диагональная
                for (let i = 0; i < this.dState; i++) {
                    this.A[i] = [];
                    for (let j = 0; j < this.dState; j++) {
                        this.A[i][j] = (i === j) ? (Math.random() * 2 - 1) * 0.5 : 0;
                    }
                }
                
                this.B = []; // [16x32]
                for (let i = 0; i < this.dState; i++) {
                    this.B[i] = [];
                    for (let j = 0; j < this.dModel; j++) {
                        this.B[i][j] = (Math.random() * 2 - 1) * 0.1;
                    }
                }
                
                this.C = []; // [32x16]
                for (let i = 0; i < this.dModel; i++) {
                    this.C[i] = [];
                    for (let j = 0; j < this.dState; j++) {
                        this.C[i][j] = (Math.random() * 2 - 1) * 0.1;
                    }
                }
                
                this.D = []; // [32x32]
                for (let i = 0; i < this.dModel; i++) {
                    this.D[i] = [];
                    for (let j = 0; j < this.dModel; j++) {
                        this.D[i][j] = (Math.random() * 2 - 1) * 0.01;
                    }
                }
                
                // Селективная проекция
                this.sProj = []; // [32 x (2*16 + 1 = 33)]
                for (let i = 0; i < this.dModel; i++) {
                    this.sProj[i] = [];
                    for (let j = 0; j < 2 * this.dState + 1; j++) {
                        this.sProj[i][j] = (Math.random() * 2 - 1) * 0.1;
                    }
                }
                
                this.h = new Array(this.dState).fill(0);
                this.delta = 0.1;
            }
            
            forward(x) {
                // x должен быть [32]
                if (!x || x.length !== this.dModel) {
                    x = new Array(this.dModel).fill(0);
                }
                
                // 1. Селективные параметры
                const params = new Array(2 * this.dState + 1).fill(0);
                for (let i = 0; i < params.length; i++) {
                    let sum = 0;
                    for (let j = 0; j < this.dModel; j++) {
                        sum += (x[j] || 0) * (this.sProj[j][i] || 0);
                    }
                    params[i] = sum;
                }
                
                const B_sel = params.slice(0, this.dState);
                const C_sel = params.slice(this.dState, 2 * this.dState);
                const delta = Math.exp(params[2 * this.dState] || 0);
                this.delta = Math.min(0.5, Math.max(0.01, delta));
                
                // 2. Дискретизация (упрощенная)
                const A_bar = [];
                const B_bar = [];
                
                for (let i = 0; i < this.dState; i++) {
                    A_bar[i] = [];
                    B_bar[i] = [];
                    const aVal = this.A[i][i];
                    
                    for (let j = 0; j < this.dState; j++) {
                        A_bar[i][j] = (i === j) ? Math.exp(this.delta * aVal) : 0;
                    }
                    
                    for (let j = 0; j < this.dModel; j++) {
                        B_bar[i][j] = this.delta * B_sel[i];
                    }
                }
                
                // 3. Обновление состояния
                const h_new = new Array(this.dState).fill(0);
                
                for (let i = 0; i < this.dState; i++) {
                    let sumA = A_bar[i][i] * this.h[i];
                    let sumB = 0;
                    for (let j = 0; j < this.dModel; j++) {
                        sumB += B_bar[i][j] * x[j];
                    }
                    h_new[i] = sumA + sumB;
                }
                
                for (let i = 0; i < this.dState; i++) {
                    this.h[i] = Math.tanh(h_new[i]);
                }
                
                // 4. Выход
                const y = new Array(this.dModel).fill(0);
                
                for (let i = 0; i < this.dModel; i++) {
                    let sumC = 0;
                    for (let j = 0; j < this.dState; j++) {
                        sumC += C_sel[j] * this.h[j];
                    }
                    let sumD = 0;
                    for (let j = 0; j < this.dModel; j++) {
                        sumD += this.D[i][j] * x[j];
                    }
                    y[i] = sumC + sumD;
                }
                
                return y;
            }
            
            reset() {
                this.h.fill(0);
            }
            
            clone() {
                const clone = new MambaCore();
                clone.A = JSON.parse(JSON.stringify(this.A));
                clone.B = JSON.parse(JSON.stringify(this.B));
                clone.C = JSON.parse(JSON.stringify(this.C));
                clone.D = JSON.parse(JSON.stringify(this.D));
                clone.sProj = JSON.parse(JSON.stringify(this.sProj));
                return clone;
            }
            
            mutate(rate, strength) {
                for (let i = 0; i < this.A.length; i++) {
                    for (let j = 0; j < this.A[i].length; j++) {
                        if (Math.random() < rate) this.A[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                for (let i = 0; i < this.B.length; i++) {
                    for (let j = 0; j < this.B[i].length; j++) {
                        if (Math.random() < rate) this.B[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                for (let i = 0; i < this.C.length; i++) {
                    for (let j = 0; j < this.C[i].length; j++) {
                        if (Math.random() < rate) this.C[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                for (let i = 0; i < this.D.length; i++) {
                    for (let j = 0; j < this.D[i].length; j++) {
                        if (Math.random() < rate) this.D[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                for (let i = 0; i < this.sProj.length; i++) {
                    for (let j = 0; j < this.sProj[i].length; j++) {
                        if (Math.random() < rate) this.sProj[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
            }
        }

        // ======================================================================
        // WORLD MODEL
        // ======================================================================
        class WorldModel {
            constructor(weights = null) {
                this.obsDim = CONFIG.OBS_DIM;        // 6
                this.latentDim = CONFIG.LATENT_DIM;   // 32
                this.actionDim = CONFIG.ACTION_DIM;   // 8
                
                if (weights) {
                    this.load(weights);
                } else {
                    // Embedding [6x32]
                    this.embed = [];
                    for (let i = 0; i < this.obsDim; i++) {
                        this.embed[i] = [];
                        for (let j = 0; j < this.latentDim; j++) {
                            this.embed[i][j] = (Math.random() * 2 - 1) * 0.1;
                        }
                    }
                    
                    // Mamba core
                    this.mamba = new MambaCore();
                    
                    // Decoder [32x6]
                    this.decoder = [];
                    for (let i = 0; i < this.latentDim; i++) {
                        this.decoder[i] = [];
                        for (let j = 0; j < this.obsDim; j++) {
                            this.decoder[i][j] = (Math.random() * 2 - 1) * 0.1;
                        }
                    }
                    
                    // Perceptron
                    this.p1 = []; // [32x64]
                    for (let i = 0; i < this.latentDim; i++) {
                        this.p1[i] = [];
                        for (let j = 0; j < 64; j++) {
                            this.p1[i][j] = (Math.random() * 2 - 1) * 0.1;
                        }
                    }
                    
                    this.p2 = []; // [64x32]
                    for (let i = 0; i < 64; i++) {
                        this.p2[i] = [];
                        for (let j = 0; j < 32; j++) {
                            this.p2[i][j] = (Math.random() * 2 - 1) * 0.1;
                        }
                    }
                    
                    this.p3 = []; // [32x8]
                    for (let i = 0; i < 32; i++) {
                        this.p3[i] = [];
                        for (let j = 0; j < this.actionDim; j++) {
                            this.p3[i][j] = (Math.random() * 2 - 1) * 0.1;
                        }
                    }
                    
                    this.b1 = new Array(64).fill(0);
                    this.b2 = new Array(32).fill(0);
                    this.b3 = new Array(this.actionDim).fill(0);
                }
                
                this.latent = new Array(this.latentDim).fill(0);
                this.actions = new Array(this.actionDim).fill(0);
                this.pred = new Array(this.obsDim).fill(0);
            }
            
            load(w) {
                this.embed = w.embed;
                this.mamba = w.mamba;
                this.decoder = w.decoder;
                this.p1 = w.p1;
                this.p2 = w.p2;
                this.p3 = w.p3;
                this.b1 = w.b1;
                this.b2 = w.b2;
                this.b3 = w.b3;
            }
            
            save() {
                return {
                    embed: JSON.parse(JSON.stringify(this.embed)),
                    mamba: this.mamba.clone(),
                    decoder: JSON.parse(JSON.stringify(this.decoder)),
                    p1: JSON.parse(JSON.stringify(this.p1)),
                    p2: JSON.parse(JSON.stringify(this.p2)),
                    p3: JSON.parse(JSON.stringify(this.p3)),
                    b1: [...this.b1],
                    b2: [...this.b2],
                    b3: [...this.b3]
                };
            }
            
            clone() {
                return new WorldModel(this.save());
            }
            
            mutate(rate, strength) {
                for (let i = 0; i < this.embed.length; i++) {
                    for (let j = 0; j < this.embed[i].length; j++) {
                        if (Math.random() < rate) this.embed[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                
                this.mamba.mutate(rate, strength);
                
                for (let i = 0; i < this.decoder.length; i++) {
                    for (let j = 0; j < this.decoder[i].length; j++) {
                        if (Math.random() < rate) this.decoder[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                
                for (let i = 0; i < this.p1.length; i++) {
                    for (let j = 0; j < this.p1[i].length; j++) {
                        if (Math.random() < rate) this.p1[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                
                for (let i = 0; i < this.p2.length; i++) {
                    for (let j = 0; j < this.p2[i].length; j++) {
                        if (Math.random() < rate) this.p2[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                
                for (let i = 0; i < this.p3.length; i++) {
                    for (let j = 0; j < this.p3[i].length; j++) {
                        if (Math.random() < rate) this.p3[i][j] += (Math.random() * 2 - 1) * strength;
                    }
                }
                
                for (let i = 0; i < this.b1.length; i++) {
                    if (Math.random() < rate) this.b1[i] += (Math.random() * 2 - 1) * strength;
                }
                for (let i = 0; i < this.b2.length; i++) {
                    if (Math.random() < rate) this.b2[i] += (Math.random() * 2 - 1) * strength;
                }
                for (let i = 0; i < this.b3.length; i++) {
                    if (Math.random() < rate) this.b3[i] += (Math.random() * 2 - 1) * strength;
                }
            }
            
            reset() {
                this.mamba.reset();
            }
            
            encode(obs) {
                // obs: [{x,y,vx,vy,type,hp}]
                const vec = new Array(this.latentDim).fill(0);
                
                for (let obj of obs.slice(0, 5)) {
                    const input = [
                        (obj.x || 0) / CONFIG.WIDTH,
                        (obj.y || 0) / CONFIG.HEIGHT,
                        ((obj.vx || 0) / CONFIG.AGENT_SPEED) * 0.5,
                        ((obj.vy || 0) / CONFIG.AGENT_SPEED) * 0.5,
                        obj.type === 'enemy' ? 1 : (obj.type === 'resource' ? 0.5 : 0),
                        (obj.hp || 0) / CONFIG.MAX_HP
                    ];
                    
                    for (let i = 0; i < this.latentDim; i++) {
                        let sum = 0;
                        for (let j = 0; j < this.obsDim; j++) {
                            sum += input[j] * (this.embed[j][i] || 0);
                        }
                        vec[i] += sum * 0.2;
                    }
                }
                
                return vec;
            }
            
            forward(obs) {
                if (!obs) obs = [];
                
                // Encode
                const x = this.encode(obs);
                
                // Mamba
                const y = this.mamba.forward(x);
                this.latent = y;
                
                // Decoder (prediction)
                for (let i = 0; i < this.obsDim; i++) {
                    let sum = 0;
                    for (let j = 0; j < this.latentDim; j++) {
                        sum += this.latent[j] * (this.decoder[j][i] || 0);
                    }
                    this.pred[i] = sum;
                }
                
                // Perceptron
                let h1 = new Array(64).fill(0);
                for (let i = 0; i < 64; i++) {
                    let sum = 0;
                    for (let j = 0; j < this.latentDim; j++) {
                        sum += this.latent[j] * (this.p1[j][i] || 0);
                    }
                    h1[i] = Math.max(0, sum + this.b1[i]);
                }
                
                let h2 = new Array(32).fill(0);
                for (let i = 0; i < 32; i++) {
                    let sum = 0;
                    for (let j = 0; j < 64; j++) {
                        sum += h1[j] * (this.p2[j][i] || 0);
                    }
                    h2[i] = Math.max(0, sum + this.b2[i]);
                }
                
                for (let i = 0; i < this.actionDim; i++) {
                    let sum = 0;
                    for (let j = 0; j < 32; j++) {
                        sum += h2[j] * (this.p3[j][i] || 0);
                    }
                    this.actions[i] = Math.tanh(sum + this.b3[i]);
                }
                
                return {
                    actions: this.actions,
                    latent: this.latent,
                    pred: this.pred,
                    delta: this.mamba.delta
                };
            }
        }

        // ======================================================================
        // ИГРОВЫЕ ОБЪЕКТЫ
        // ======================================================================
        class GameObject {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.radius = CONFIG.AGENT_RADIUS;
                this.id = Math.random().toString(36).substr(2, 4);
            }
        }

        class Bullet extends GameObject {
            constructor(x, y, vx, vy, owner) {
                super(x, y, 'bullet');
                this.vx = vx;
                this.vy = vy;
                this.owner = owner;
                this.life = 80;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
        }

        class Resource extends GameObject {
            constructor(x, y) {
                super(x, y, 'resource');
                this.radius = 8;
                this.value = 30;
                this.respawn = 0;
            }
        }

        class Wall {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }
            contains(x, y) {
                return x >= this.x && x <= this.x + this.w && y >= this.y && y <= this.y + this.h;
            }
        }

        class Agent extends GameObject {
            constructor(x, y, team, brain = null) {
                super(x, y, 'agent');
                this.team = team;
                this.hp = CONFIG.MAX_HP;
                this.maxHp = CONFIG.MAX_HP;
                this.brain = brain || new WorldModel();
                this.cooldown = 0;
                this.fitness = 0;
                this.kills = 0;
                this.damage = 0;
                this.angle = 0;
                this.color = team === 'green' ? '#00ff88' : '#ff4444';
                this.latent = new Array(CONFIG.LATENT_DIM).fill(0);
            }

            getVisible(agents, resources, walls) {
                const vis = [];
                
                for (let a of agents) {
                    if (a === this || a.hp <= 0) continue;
                    const dx = a.x - this.x;
                    const dy = a.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < CONFIG.VIEW_DIST) {
                        vis.push({
                            x: a.x, y: a.y, vx: a.vx, vy: a.vy,
                            type: a.team === this.team ? 'ally' : 'enemy',
                            hp: a.hp
                        });
                    }
                }
                
                for (let r of resources) {
                    if (r.respawn > 0) continue;
                    const dx = r.x - this.x;
                    const dy = r.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < CONFIG.VIEW_DIST) {
                        vis.push({ x: r.x, y: r.y, vx:0, vy:0, type:'resource', hp:100 });
                    }
                }
                
                return vis;
            }

            think(agents, resources, walls) {
                const vis = this.getVisible(agents, resources, walls);
                const out = this.brain.forward(vis);
                this.latent = out.latent;
                
                // Движение
                const moveX = (out.actions[3] || 0) - (out.actions[2] || 0);
                const moveY = (out.actions[1] || 0) - (out.actions[0] || 0);
                const len = Math.sqrt(moveX*moveX + moveY*moveY);
                
                if (len > 0.01) {
                    this.vx += (moveX/len) * CONFIG.AGENT_SPEED * 0.5;
                    this.vy += (moveY/len) * CONFIG.AGENT_SPEED * 0.5;
                } else {
                    this.vx += (Math.random() - 0.5) * 0.3;
                    this.vy += (Math.random() - 0.5) * 0.3;
                }
                
                // Стрельба
                if ((out.actions[4] || 0) > 0.3 && this.cooldown <= 0) {
                    this.cooldown = CONFIG.SHOOT_COOLDOWN;
                    let target = null;
                    let minDist = Infinity;
                    for (let a of agents) {
                        if (a.team !== this.team && a.hp > 0) {
                            const d = Math.hypot(a.x - this.x, a.y - this.y);
                            if (d < minDist) { minDist = d; target = a; }
                        }
                    }
                    if (target) {
                        const angle = Math.atan2(target.y - this.y, target.x - this.x);
                        const b = new Bullet(
                            this.x + Math.cos(angle)*20,
                            this.y + Math.sin(angle)*20,
                            Math.cos(angle)*CONFIG.BULLET_SPEED,
                            Math.sin(angle)*CONFIG.BULLET_SPEED,
                            this
                        );
                        if (window.game) game.bullets.push(b);
                    }
                }
                
                // Лечение
                if ((out.actions[5] || 0) > 0.2 && this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + CONFIG.HEAL * 0.5);
                }
                
                // Угол
                if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
                    this.angle = Math.atan2(this.vy, this.vx);
                }
                
                return out;
            }

            update(agents, walls) {
                this.vx *= CONFIG.FRICTION;
                this.vy *= CONFIG.FRICTION;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.x = Math.max(this.radius, Math.min(CONFIG.WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(CONFIG.HEIGHT - this.radius, this.y));
                
                for (let w of walls) {
                    if (w.contains(this.x, this.y)) {
                        const cx = w.x + w.w/2;
                        const cy = w.y + w.h/2;
                        const dx = this.x - cx;
                        const dy = this.y - cy;
                        if (Math.abs(dx)/w.w > Math.abs(dy)/w.h) {
                            this.x = dx > 0 ? w.x + w.w + this.radius : w.x - this.radius;
                        } else {
                            this.y = dy > 0 ? w.y + w.h + this.radius : w.y - this.radius;
                        }
                    }
                }
                
                if (this.cooldown > 0) this.cooldown--;
                this.fitness += 0.1;
            }

            hit(dmg, attacker) {
                this.hp -= dmg;
                if (attacker) {
                    attacker.damage += dmg;
                    attacker.fitness += dmg;
                }
                if (this.hp <= 0 && attacker) {
                    attacker.kills++;
                    attacker.fitness += 50;
                }
            }
        }

        // ======================================================================
        // GAME ENGINE
        // ======================================================================
        class Game {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.agents = [];
                this.bullets = [];
                this.resources = [];
                this.walls = [];
                this.particles = [];
                
                this.gen = 1;
                this.bestFitness = 0;
                this.bestBrain = null;
                this.running = false;
                this.paused = true;
                this.speed = 1;
                
                this.selected = null;
                this.stats = {
                    latent: new Array(CONFIG.LATENT_DIM).fill(0),
                    actions: new Array(CONFIG.ACTION_DIM).fill(0),
                    delta: 0.1
                };
                
                this.init();
                window.game = this;
            }

            init() {
                // Размер canvas
                this.canvas.width = CONFIG.WIDTH;
                this.canvas.height = CONFIG.HEIGHT;
                
                // Стены
                this.walls = [
                    new Wall(200,150,150,20), new Wall(200,350,150,20),
                    new Wall(550,150,150,20), new Wall(550,350,150,20),
                    new Wall(350,250,200,20), new Wall(100,500,200,20),
                    new Wall(600,500,200,20), new Wall(400,450,20,150)
                ];
                
                // Ресурсы
                this.resources = [
                    new Resource(150,150), new Resource(550,150),
                    new Resource(350,300), new Resource(150,450),
                    new Resource(550,450), new Resource(350,550)
                ];
                
                this.spawn();
            }

            spawn() {
                this.agents = [];
                
                // Зеленые
                for (let i = 0; i < CONFIG.POPULATION; i++) {
                    let brain;
                    if (this.bestBrain) {
                        brain = new WorldModel(this.bestBrain);
                        if (this.running) brain.mutate(CONFIG.MUTATION_RATE, CONFIG.MUTATION_STRENGTH);
                    } else {
                        brain = new WorldModel();
                    }
                    const x = 150 + Math.random() * 150;
                    const y = 150 + i * 100;
                    this.agents.push(new Agent(x, y, 'green', brain));
                }
                
                // Красные
                for (let i = 0; i < CONFIG.POPULATION; i++) {
                    let brain;
                    if (this.bestBrain) {
                        brain = new WorldModel(this.bestBrain);
                        if (this.running) brain.mutate(CONFIG.MUTATION_RATE, CONFIG.MUTATION_STRENGTH);
                    } else {
                        brain = new WorldModel();
                    }
                    const x = CONFIG.WIDTH - 150 - Math.random() * 150;
                    const y = 150 + i * 100;
                    this.agents.push(new Agent(x, y, 'red', brain));
                }
                
                this.selected = this.agents[0];
            }

            update() {
                if (this.paused || !this.running) return;
                
                for (let s = 0; s < this.speed; s++) {
                    const alive = this.agents.filter(a => a.hp > 0);
                    
                    for (let a of alive) {
                        const out = a.think(this.agents, this.resources, this.walls);
                        if (a === this.selected) {
                            this.stats.latent = out.latent;
                            this.stats.actions = out.actions;
                            this.stats.delta = out.delta;
                        }
                    }
                    
                    for (let a of alive) a.update(this.agents, this.walls);
                    
                    // Пули
                    for (let i = this.bullets.length-1; i >= 0; i--) {
                        const b = this.bullets[i];
                        b.update();
                        for (let a of this.agents) {
                            if (a.hp <= 0 || a === b.owner) continue;
                            if (a.team === b.owner.team) continue;
                            if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius) {
                                a.hit(CONFIG.DAMAGE, b.owner);
                                this.bullets.splice(i,1);
                                break;
                            }
                        }
                        if (b.life <= 0) this.bullets.splice(i,1);
                    }
                    
                    // Ресурсы
                    for (let a of alive) {
                        for (let r of this.resources) {
                            if (r.respawn > 0) continue;
                            if (Math.hypot(a.x - r.x, a.y - r.y) < a.radius + r.radius) {
                                a.hp = Math.min(CONFIG.MAX_HP, a.hp + r.value);
                                a.fitness += 20;
                                r.respawn = 200;
                            }
                        }
                    }
                    
                    for (let r of this.resources) if (r.respawn > 0) r.respawn--;
                    
                    const green = this.agents.filter(a => a.team === 'green' && a.hp > 0).length;
                    const red = this.agents.filter(a => a.team === 'red' && a.hp > 0).length;
                    
                    if (green === 0 || red === 0) {
                        this.nextGen();
                        break;
                    }
                }
            }

            nextGen() {
                let best = null;
                let maxFit = -Infinity;
                for (let a of this.agents) {
                    if (a.fitness > maxFit) { maxFit = a.fitness; best = a; }
                }
                if (best && best.fitness > this.bestFitness) {
                    this.bestFitness = best.fitness;
                    this.bestBrain = best.brain.save();
                }
                this.gen++;
                this.spawn();
                this.bullets = [];
            }

            draw() {
                // Очистка
                this.ctx.fillStyle = '#0a0a0f';
                this.ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                // Сетка
                this.ctx.strokeStyle = 'rgba(0,255,255,0.05)';
                for (let x = 0; x < CONFIG.WIDTH; x += 40) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, CONFIG.HEIGHT);
                    this.ctx.stroke();
                }
                for (let y = 0; y < CONFIG.HEIGHT; y += 40) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(CONFIG.WIDTH, y);
                    this.ctx.stroke();
                }
                
                // Стены
                this.ctx.fillStyle = '#1a1a2e';
                for (let w of this.walls) {
                    this.ctx.fillRect(w.x, w.y, w.w, w.h);
                }
                
                // Ресурсы
                for (let r of this.resources) {
                    if (r.respawn === 0) {
                        this.ctx.beginPath();
                        this.ctx.arc(r.x, r.y, r.radius, 0, Math.PI*2);
                        this.ctx.fillStyle = '#00ffff';
                        this.ctx.shadowBlur = 20;
                        this.ctx.shadowColor = '#00ffff';
                        this.ctx.fill();
                    }
                }
                
                // Пули
                for (let b of this.bullets) {
                    this.ctx.beginPath();
                    this.ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
                    this.ctx.fillStyle = '#ffff00';
                    this.ctx.fill();
                }
                
                // Агенты
                for (let a of this.agents) {
                    if (a.hp <= 0) continue;
                    
                    // Свечение
                    const intensity = a.latent.reduce((s,v) => s+Math.abs(v),0)/32;
                    const grad = this.ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,a.radius*3);
                    grad.addColorStop(0, a.color + '30');
                    grad.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = grad;
                    this.ctx.fillRect(a.x-a.radius*3, a.y-a.radius*3, a.radius*6, a.radius*6);
                    
                    // Тело
                    this.ctx.save();
                    this.ctx.translate(a.x, a.y);
                    this.ctx.rotate(a.angle);
                    this.ctx.beginPath();
                    this.ctx.moveTo(a.radius, 0);
                    this.ctx.lineTo(-a.radius*0.7, a.radius*0.7);
                    this.ctx.lineTo(-a.radius*0.4, 0);
                    this.ctx.lineTo(-a.radius*0.7, -a.radius*0.7);
                    this.ctx.closePath();
                    this.ctx.fillStyle = a.color;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = a.color;
                    this.ctx.fill();
                    this.ctx.restore();
                    
                    // HP
                    const barW = 30;
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillRect(a.x-barW/2, a.y-a.radius-12, barW, 4);
                    this.ctx.fillStyle = '#00ff88';
                    this.ctx.fillRect(a.x-barW/2, a.y-a.radius-12, barW * a.hp/a.maxHp, 4);
                }
                
                // Конус выбранного
                if (this.selected && this.selected.hp > 0) {
                    this.ctx.beginPath();
                    this.ctx.arc(this.selected.x, this.selected.y, CONFIG.VIEW_DIST, 0, Math.PI*2);
                    this.ctx.fillStyle = 'rgba(0,255,255,0.03)';
                    this.ctx.fill();
                    this.ctx.strokeStyle = 'rgba(0,255,255,0.2)';
                    this.ctx.setLineDash([5,10]);
                    this.ctx.stroke();
                }
                
                this.ctx.shadowBlur = 0;
            }

            updateUI() {
                const green = this.agents.filter(a => a.team === 'green' && a.hp > 0).length;
                const red = this.agents.filter(a => a.team === 'red' && a.hp > 0).length;
                
                document.getElementById('greenCount').textContent = green;
                document.getElementById('redCount').textContent = red;
                document.getElementById('gen').textContent = this.gen;
                document.getElementById('best').textContent = Math.floor(this.bestFitness);
                document.getElementById('status').innerHTML = this.running ? (this.paused ? '⏸ PAUSED' : '🚀 MAMBA ACTIVE') : '⏹ STOPPED';
                document.getElementById('delta').textContent = this.stats.delta.toFixed(3);
                
                if (this.selected && this.selected.brain) {
                    const aNorm = Math.sqrt(this.selected.brain.mamba.A.reduce((s,row) => s + row.reduce((ss,v) => ss + v*v,0),0));
                    const bNorm = Math.sqrt(this.selected.brain.mamba.B.reduce((s,row) => s + row.reduce((ss,v) => ss + v*v,0),0));
                    document.getElementById('aNorm').textContent = aNorm.toFixed(3);
                    document.getElementById('bNorm').textContent = bNorm.toFixed(3);
                }
                
                // Нейроны
                const map = document.getElementById('neuron-map');
                map.innerHTML = '';
                for (let i = 0; i < 32; i++) {
                    const n = document.createElement('div');
                    n.className = 'neuron';
                    const val = this.stats.latent[i] || 0;
                    const bright = Math.floor(20 + Math.abs(val) * 50);
                    n.style.background = `rgb(0, ${bright}, ${bright})`;
                    map.appendChild(n);
                }
                
                // Actions
                for (let i = 0; i < 8; i++) {
                    const el = document.getElementById(`act${i}`);
                    if (el) el.textContent = (this.stats.actions[i] || 0).toFixed(2);
                }
                
                // Список агентов
                const list = document.getElementById('agentList');
                list.innerHTML = '';
                for (let a of this.agents) {
                    if (a.hp <= 0) continue;
                    const item = document.createElement('div');
                    item.className = 'agent-item';
                    item.onclick = () => this.selected = a;
                    item.innerHTML = `
                        <div class="agent-color" style="background:${a.color}"></div>
                        <div style="flex:1">
                            <div>${a.team==='green'?'🟢':'🔴'} ${a.id} K:${a.kills}</div>
                            <div class="agent-hp"><div class="agent-hp-fill" style="width:${a.hp/a.maxHp*100}%"></div></div>
                        </div>
                    `;
                    list.appendChild(item);
                }
            }

            loop() {
                this.update();
                this.draw();
                this.updateUI();
                requestAnimationFrame(() => this.loop());
            }
        }

        // ======================================================================
        // ГЛОБАЛЬНОЕ
        // ======================================================================
        let game;
        let frameCount = 0;

        window.onload = function() {
            game = new Game();
            game.loop();
            
            setInterval(() => {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
            }, 1000);
            
            document.getElementById('speed').addEventListener('input', e => {
                if (game) game.speed = parseInt(e.target.value);
            });
        };

        window.toggleRun = function() {
            if (!game) return;
            const btn = document.getElementById('startBtn');
            if (game.running) {
                game.running = false;
                btn.textContent = '🚀 START MAMBA';
            } else {
                game.running = true;
                game.paused = false;
                btn.textContent = '⏹ STOP MAMBA';
            }
        };

        window.togglePause = function() {
            if (!game || !game.running) return;
            game.paused = !game.paused;
        };

        window.reset = function() {
            if (!game) return;
            game.running = false;
            game.paused = true;
            game.gen = 1;
            game.bestFitness = 0;
            game.bestBrain = null;
            game.spawn();
            game.bullets = [];
            document.getElementById('startBtn').textContent = '🚀 START MAMBA';
        };

        // FPS
        const originalRaf = window.requestAnimationFrame;
        window.requestAnimationFrame = function(cb) {
            return originalRaf(function(t) {
                frameCount++;
                cb(t);
            });
        };
    </script>
</body>
