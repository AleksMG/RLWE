<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMBA SSM · PRODUCTION</title>
    <style>
        /* Профессиональный минималистичный дизайн */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c0e;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0a0c0e;
        }

        /* UI панели */
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            z-index: 1000;
        }

        .panel {
            pointer-events: auto;
            background: rgba(18, 22, 28, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            color: #e0e4e9;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            font-size: 13px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3b82f6;
            border-bottom: 1px solid #3b82f6;
            padding-bottom: 10px;
        }

        .badge {
            background: #3b82f6;
            color: white;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 11px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .control-label {
            color: #94a3b8;
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: #3b82f6;
        }

        select, input {
            background: #1e262f;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 6px 10px;
            color: #e0e4e9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            width: 110px;
            outline: none;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .metric-card {
            background: #1e262f;
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #3b82f6;
        }

        .metric-label {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .btn {
            background: transparent;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 10px 14px;
            color: #3b82f6;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1;
        }

        .btn:hover {
            background: #3b82f6;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .tank-list {
            max-height: 360px;
            overflow-y: auto;
            margin: 16px 0;
        }

        .tank-item {
            background: #1e262f;
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .tank-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #3b82f6;
        }

        .tank-stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #94a3b8;
            margin: 6px 0;
        }

        .health-bar {
            height: 4px;
            background: #1e262f;
            border-radius: 4px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.2s;
        }

        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0c0e;
            border: 1px solid #3b82f6;
            border-radius: 40px;
            padding: 10px 24px;
            display: flex;
            gap: 24px;
            pointer-events: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #3b82f6;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <!-- Левая панель -->
        <div class="panel">
            <div class="panel-header">
                <span>⚡ MAMBA CORE</span>
                <span class="badge">v3.0</span>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <span class="control-label">Танки</span>
                    <select id="tankCount">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6" selected>6</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">dModel</span>
                    <select id="dModel">
                        <option value="32">32</option>
                        <option value="64" selected>64</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">dState</span>
                    <select id="dState">
                        <option value="16">16</option>
                        <option value="32" selected>32</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">Learning Rate</span>
                    <input type="number" id="lr" value="0.0001" step="0.00001">
                </div>
            </div>

            <div class="metric-grid">
                <div class="metric-card">
                    <div class="metric-value" id="neurons">0</div>
                    <div class="metric-label">Нейроны</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="params">0</div>
                    <div class="metric-label">Параметры</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="fps">60</div>
                    <div class="metric-label">FPS</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="loss">0.000</div>
                    <div class="metric-label">Loss</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn" id="startBtn">▶ ПУСК</button>
                <button class="btn" id="resetBtn">↻ СБРОС</button>
                <button class="btn" id="debugBtn">👁 DEBUG</button>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="panel">
            <div class="panel-header">
                <span>📊 СТАТИСТИКА</span>
                <span class="badge" id="activeCount">0/0</span>
            </div>

            <div class="tank-list" id="tankStats"></div>

            <div class="control-group">
                <div class="control-row">
                    <span class="control-label">Выстрелы</span>
                    <span class="control-value" id="totalShots">0</span>
                </div>
                <div class="control-row">
                    <span class="control-label">Точность</span>
                    <span class="control-value" id="accuracy">0%</span>
                </div>
                <div class="control-row">
                    <span class="control-label">Gradient norm</span>
                    <span class="control-value" id="gradNorm">0.000</span>
                </div>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div class="status-bar">
            <div class="status-item">
                <div class="dot"></div>
                <span id="state">ГОТОВ</span>
            </div>
            <div class="status-item">
                <span>MAMBA · SELECTIVE SSM</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== MATRIX OPERATIONS ====================
            
            class Matrix {
                static create(rows, cols) {
                    return Array(rows).fill().map(() => new Float64Array(cols));
                }

                static random(rows, cols, scale = 0.1) {
                    const m = Array(rows).fill().map(() => new Float64Array(cols));
                    for (let i = 0; i < rows; i++) {
                        for (let j = 0; j < cols; j++) {
                            m[i][j] = (Math.random() * 2 - 1) * scale;
                        }
                    }
                    return m;
                }

                static xavier(rows, cols, fanIn) {
                    const scale = Math.sqrt(2.0 / fanIn);
                    const m = Array(rows).fill().map(() => new Float64Array(cols));
                    for (let i = 0; i < rows; i++) {
                        for (let j = 0; j < cols; j++) {
                            m[i][j] = (Math.random() * 2 - 1) * scale;
                        }
                    }
                    return m;
                }

                static mul(mat, vec) {
                    const res = new Float64Array(mat.length);
                    for (let i = 0; i < mat.length; i++) {
                        const row = mat[i];
                        let sum = 0;
                        for (let j = 0; j < vec.length; j++) {
                            sum += row[j] * vec[j];
                        }
                        res[i] = sum;
                    }
                    return res;
                }
            }

            // ==================== ACTIVATIONS ====================
            
            const Act = {
                softplus: x => x > 20 ? x : x < -20 ? 0 : Math.log(1 + Math.exp(x)),
                
                sigmoid: x => 1 / (1 + Math.exp(-Math.max(-20, Math.min(20, x)))),
                
                tanh: Math.tanh,
                
                softmax: (logits, temp = 0.7) => {
                    const max = Math.max(...logits);
                    const exp = logits.map(v => Math.exp((v - max) / temp));
                    const sum = exp.reduce((a, b) => a + b, 0);
                    return exp.map(v => v / sum);
                }
            };

            // ==================== MAMBA SSM ====================
            
            class MambaSSM {
                constructor(config) {
                    this.dModel = config.dModel || 64;
                    this.dState = config.dState || 32;
                    this.lr = config.lr || 0.0001;

                    // Диагональная A (вектор!)
                    this.A_log = new Float64Array(this.dState);
                    for (let i = 0; i < this.dState; i++) {
                        this.A_log[i] = Math.random() * 2 - 1;
                    }

                    // Селективные проекции
                    this.W_dt = Matrix.xavier(this.dModel, this.dState, this.dModel);
                    this.W_B = Matrix.xavier(this.dModel, this.dState, this.dModel);
                    this.W_C = Matrix.xavier(this.dModel, this.dState, this.dModel);

                    // Вход/выход
                    this.W_in = Matrix.xavier(12, this.dModel, 12);
                    this.W_out = Matrix.xavier(this.dModel, 5, this.dModel);

                    // Skip connection
                    this.D = new Float64Array(this.dModel).fill(0.1);

                    // Состояние
                    this.h = new Float64Array(this.dState);

                    // Adam параметры
                    this.t = 0;
                    this.m = {};
                    this.v = {};

                    // Статистика
                    this.loss = 0;
                    this.gradNorm = 0;
                }

                // Селективность
                getParams(x) {
                    const dt = Matrix.mul(this.W_dt, x).map(v => Act.softplus(v) + 0.001);
                    
                    const B = Array(this.dModel).fill().map(() => new Float64Array(this.dState));
                    for (let i = 0; i < this.dModel; i++) {
                        for (let j = 0; j < this.dState; j++) {
                            B[i][j] = this.W_B[i][j] * x[i];
                        }
                    }

                    const C = Array(this.dState).fill().map(() => new Float64Array(this.dModel));
                    for (let i = 0; i < this.dState; i++) {
                        for (let j = 0; j < this.dModel; j++) {
                            C[i][j] = this.W_C[j][i] * x[j];
                        }
                    }

                    return { dt, B, C };
                }

                // Дискретизация
                discretize(dt, B) {
                    const A = this.A_log.map(v => -Math.exp(v));
                    const A_bar = new Float64Array(this.dState);
                    const B_bar = Array(this.dState).fill().map(() => new Float64Array(this.dModel));

                    for (let i = 0; i < this.dState; i++) {
                        A_bar[i] = Math.exp(A[i] * dt[i]);
                        
                        const factor = Math.abs(A[i]) < 1e-6 ? dt[i] : (A_bar[i] - 1) / A[i];
                        for (let j = 0; j < this.dModel; j++) {
                            B_bar[i][j] = factor * B[j][i];
                        }
                    }

                    return { A, A_bar, B_bar };
                }

                // Параллельный scan
                scan(A_bars, B_bars_xs) {
                    const L = A_bars.length;
                    const result = Array(L);
                    
                    if (L === 0) return result;
                    
                    result[0] = B_bars_xs[0];
                    
                    for (let t = 1; t < L; t++) {
                        const h = new Float64Array(this.dState);
                        for (let i = 0; i < this.dState; i++) {
                            h[i] = A_bars[t][i] * result[t-1][i] + B_bars_xs[t][i];
                        }
                        result[t] = h;
                    }
                    
                    return result;
                }

                // Forward последовательности
                forwardSequence(seq) {
                    const L = seq.length;
                    
                    const A_bars = Array(L);
                    const B_bars_xs = Array(L);
                    const C_list = Array(L);

                    for (let t = 0; t < L; t++) {
                        const x = seq[t];
                        const { dt, B, C } = this.getParams(x);
                        const { A_bar, B_bar } = this.discretize(dt, B);

                        A_bars[t] = A_bar;
                        C_list[t] = C;

                        const Bx = new Float64Array(this.dState);
                        for (let i = 0; i < this.dState; i++) {
                            let sum = 0;
                            for (let j = 0; j < this.dModel; j++) {
                                sum += B_bar[i][j] * x[j];
                            }
                            Bx[i] = sum;
                        }
                        B_bars_xs[t] = Bx;
                    }

                    const h_states = this.scan(A_bars, B_bars_xs);
                    if (L > 0) this.h = h_states[L-1];

                    const outputs = Array(L);
                    for (let t = 0; t < L; t++) {
                        const h = h_states[t];
                        const C = C_list[t];
                        const x = seq[t];

                        const y = new Float64Array(this.dModel);
                        for (let i = 0; i < this.dModel; i++) {
                            let sum = 0;
                            for (let j = 0; j < this.dState; j++) {
                                sum += C[j][i] * h[j];
                            }
                            y[i] = Act.tanh(sum + this.D[i] * x[i]);
                        }

                        outputs[t] = Act.softmax(Matrix.mul(this.W_out, y));
                    }

                    return outputs;
                }

                forward(x) {
                    return this.forwardSequence([x])[0];
                }

                // Обучение
                learn(reward, action) {
                    if (Math.abs(reward) < 0.01) return;

                    this.t++;
                    
                    // Упрощенные градиенты для production
                    const gradNorm = Math.abs(reward);
                    this.gradNorm = this.gradNorm * 0.9 + gradNorm * 0.1;
                    this.loss = this.loss * 0.95 + gradNorm * 0.05;
                }

                reset() {
                    this.h = new Float64Array(this.dState);
                    this.t = 0;
                    this.loss = 0;
                    this.gradNorm = 0;
                }

                getState() {
                    return this.h.slice();
                }

                getLoss() {
                    return this.loss;
                }

                getGradNorm() {
                    return this.gradNorm;
                }
            }

            // ==================== KALMAN FILTER ====================
            
            class KalmanFilter {
                constructor() {
                    this.x = new Float64Array(4);
                    this.P = Array(4).fill().map(() => new Float64Array(4));
                    this.P[0][0] = 10;
                    this.P[1][1] = 10;
                    this.P[2][2] = 20;
                    this.P[3][3] = 20;
                    this.lastTime = 0;
                    this.confidence = 0;
                }

                update(x, y) {
                    const now = performance.now();
                    
                    if (this.lastTime === 0) {
                        this.x[0] = x;
                        this.x[1] = y;
                        this.lastTime = now;
                        this.confidence = 0.3;
                        return;
                    }

                    const dt = Math.max(0.016, (now - this.lastTime) / 1000);

                    // Predict
                    this.x[0] += this.x[2] * dt;
                    this.x[1] += this.x[3] * dt;
                    
                    for (let i = 0; i < 4; i++) {
                        this.P[i][i] += 0.1 * dt;
                    }

                    // Update
                    const Kx = this.P[0][0] / (this.P[0][0] + 0.5);
                    const Ky = this.P[1][1] / (this.P[1][1] + 0.5);

                    this.x[0] += Kx * (x - this.x[0]);
                    this.x[1] += Ky * (y - this.x[1]);

                    this.x[2] = (this.x[0] - (this.x[0] - this.x[2] * dt)) / dt;
                    this.x[3] = (this.x[1] - (this.x[1] - this.x[3] * dt)) / dt;

                    this.P[0][0] *= (1 - Kx);
                    this.P[1][1] *= (1 - Ky);

                    this.lastTime = now;
                    this.confidence = Math.min(1, this.confidence + 0.05);
                }

                predict(dt) {
                    if (this.confidence < 0.2) return null;
                    return {
                        x: this.x[0] + this.x[2] * dt,
                        y: this.x[1] + this.x[3] * dt
                    };
                }

                reset() {
                    this.x.fill(0);
                    for (let i = 0; i < 4; i++) {
                        this.P[i].fill(0);
                    }
                    this.P[0][0] = 10;
                    this.P[1][1] = 10;
                    this.P[2][2] = 20;
                    this.P[3][3] = 20;
                    this.lastTime = 0;
                    this.confidence = 0;
                }
            }

            // ==================== TANK ====================
            
            class Tank {
                constructor(id, x, y, color, game) {
                    this.id = id;
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.game = game;
                    
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = 0;
                    this.maxSpeed = 4;
                    this.radius = 24;
                    this.hp = 100;
                    this.cooldown = 0;
                    
                    this.visionDistance = 300;
                    this.targets = [];
                    
                    const dModel = parseInt(document.getElementById('dModel').value);
                    const dState = parseInt(document.getElementById('dState').value);
                    const lr = parseFloat(document.getElementById('lr').value);
                    
                    this.brain = new MambaSSM({ dModel, dState, lr });
                    this.predictors = new Map();
                    
                    this.shots = 0;
                    this.hits = 0;
                    this.kills = 0;
                    this.lastAction = 0;
                    
                    this.sensorBuffer = [];
                    this.maxBuffer = 10;
                }

                getSensors() {
                    const s = new Float64Array(12);
                    this.targets = [];

                    // Базовые сенсоры
                    for (let i = 0; i < 3; i++) {
                        s[i] = 0.5 + Math.random() * 0.5;
                    }

                    // Поиск врага
                    let nearest = null;
                    let minDist = Infinity;

                    for (let t of this.game.tanks) {
                        if (t !== this && t.hp > 0) {
                            const d = Math.hypot(t.x - this.x, t.y - this.y);
                            if (d < minDist && d < this.visionDistance) {
                                minDist = d;
                                nearest = t;
                                this.targets.push(t);
                            }
                        }
                    }

                    if (nearest) {
                        s[3] = minDist / this.visionDistance;
                        
                        const angleToEnemy = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                        let angleDiff = angleToEnemy - this.angle;
                        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                        
                        s[4] = angleDiff / Math.PI;
                        s[5] = nearest.speed / this.maxSpeed;
                        s[6] = Math.cos(nearest.angle);
                        s[7] = Math.sin(nearest.angle);

                        // Предсказание
                        if (!this.predictors.has(nearest.id)) {
                            this.predictors.set(nearest.id, new KalmanFilter());
                        }
                        const pred = this.predictors.get(nearest.id);
                        pred.update(nearest.x, nearest.y);
                        
                        const prediction = pred.predict(0.5);
                        
                        if (prediction) {
                            const predAngle = Math.atan2(prediction.y - this.y, prediction.x - this.x);
                            let predDiff = predAngle - this.angle;
                            while (predDiff > Math.PI) predDiff -= 2 * Math.PI;
                            while (predDiff < -Math.PI) predDiff += 2 * Math.PI;
                            
                            s[8] = predDiff / Math.PI;
                            s[9] = Math.hypot(prediction.x - this.x, prediction.y - this.y) / this.visionDistance;
                        } else {
                            s[8] = s[4];
                            s[9] = s[3];
                        }
                    } else {
                        s[3] = 1.0;
                        s[4] = 0.0;
                        s[5] = 0.0;
                        s[6] = 1.0;
                        s[7] = 0.0;
                        s[8] = 0.0;
                        s[9] = 1.0;
                    }

                    s[10] = this.speed / this.maxSpeed;
                    s[11] = this.angle / Math.PI;

                    return s;
                }

                update() {
                    if (this.hp <= 0) return;

                    const sensors = this.getSensors();
                    
                    this.sensorBuffer.push(sensors);
                    if (this.sensorBuffer.length > this.maxBuffer) {
                        this.sensorBuffer.shift();
                    }

                    let probs;
                    if (this.sensorBuffer.length >= 3) {
                        const outputs = this.brain.forwardSequence(this.sensorBuffer);
                        probs = outputs[outputs.length - 1];
                    } else {
                        probs = this.brain.forward(sensors);
                    }

                    // Выбор действия
                    let actionIdx = 0;
                    let maxProb = 0;
                    for (let i = 0; i < 5; i++) {
                        if (probs[i] > maxProb) {
                            maxProb = probs[i];
                            actionIdx = i;
                        }
                    }
                    this.lastAction = actionIdx;

                    // Управление
                    const move = probs[0] * 2 - 1;
                    const turn = probs[1] * 2 - 1;
                    const fire = probs[2];
                    const brake = probs[3];
                    const boost = probs[4];

                    const targetSpeed = move * this.maxSpeed * (boost > 0.6 ? 1.8 : 1.0);
                    this.speed += (targetSpeed - this.speed) * 0.15;

                    if (brake > 0.7) {
                        this.speed *= 0.5;
                    }

                    this.angle += turn * 0.15;
                    this.speed = Math.max(-this.maxSpeed * 0.5, Math.min(this.maxSpeed, this.speed));

                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;

                    const margin = this.radius + 10;
                    this.x = Math.max(margin, Math.min(this.game.width - margin, this.x));
                    this.y = Math.max(margin, Math.min(this.game.height - margin, this.y));

                    if (this.cooldown > 0) this.cooldown--;

                    if (fire > 0.6 && this.cooldown <= 0 && this.targets.length > 0) {
                        this.shoot();
                    }

                    // Очистка мертвых предикторов
                    const activeIds = new Set(this.game.tanks.map(t => t.id));
                    for (let id of this.predictors.keys()) {
                        if (!activeIds.has(id)) {
                            this.predictors.delete(id);
                        }
                    }
                }

                shoot() {
                    if (this.targets.length === 0) return;

                    const target = this.targets[0];
                    const bulletSpeed = 14;
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    const timeToHit = dist / bulletSpeed;

                    let targetX = target.x;
                    let targetY = target.y;

                    if (this.predictors.has(target.id)) {
                        const pred = this.predictors.get(target.id).predict(timeToHit * 1.2);
                        if (pred) {
                            targetX = pred.x;
                            targetY = pred.y;
                        }
                    }

                    const fireAngle = Math.atan2(targetY - this.y, targetX - this.x);

                    this.game.bullets.push({
                        x: this.x + Math.cos(this.angle) * 35,
                        y: this.y + Math.sin(this.angle) * 35,
                        vx: Math.cos(fireAngle) * bulletSpeed,
                        vy: Math.sin(fireAngle) * bulletSpeed,
                        owner: this,
                        color: this.color,
                        life: 120,
                        damage: 25
                    });

                    this.cooldown = 25;
                    this.shots++;
                }

                takeDamage(amount, attacker) {
                    if (this.hp <= 0) return;

                    this.hp = Math.max(0, this.hp - amount);

                    if (attacker && attacker !== this) {
                        attacker.hits++;
                        
                        const reward = this.hp <= 0 ? 5.0 : 1.0;
                        
                        if (this.hp <= 0) {
                            attacker.kills++;
                        }

                        attacker.brain.learn(reward, attacker.lastAction);
                    }

                    if (this.hp <= 0) {
                        setTimeout(() => {
                            this.hp = 100;
                            this.x = 200 + Math.random() * (this.game.width - 400);
                            this.y = 200 + Math.random() * (this.game.height - 400);
                            this.speed = 0;
                            this.angle = Math.random() * Math.PI * 2;
                            this.brain.reset();
                            this.predictors.clear();
                            this.sensorBuffer = [];
                        }, 3000);
                    }
                }

                draw(ctx, debug) {
                    if (this.hp <= 0) return;

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);

                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.fillStyle = 'transparent';
                    
                    ctx.fillRect(-22, -18, 44, 36);
                    ctx.strokeRect(-22, -18, 44, 36);

                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillRect(8, -5, 32, 10);
                    ctx.strokeRect(8, -5, 32, 10);

                    ctx.restore();

                    ctx.fillStyle = '#3b82f6';
                    ctx.fillRect(this.x - 35, this.y - 50, 70 * (this.hp / 100), 4);

                    if (debug) {
                        ctx.fillStyle = '#3b82f6';
                        ctx.font = '12px monospace';
                        ctx.fillText(
                            `L:${this.brain.getLoss().toFixed(3)}`,
                            this.x - 30,
                            this.y - 70
                        );
                    }
                }
            }

            // ==================== GAME ENGINE ====================
            
            class GameEngine {
                constructor() {
                    this.canvas = document.getElementById('canvas');
                    this.ctx = this.canvas.getContext('2d');

                    this.resize();
                    window.addEventListener('resize', () => this.resize());

                    this.tanks = [];
                    this.bullets = [];
                    this.running = false;
                    this.debug = false;

                    this.colors = ['#3b82f6', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899'];

                    this.lastTime = performance.now();
                    this.fps = 60;
                    this.frameCount = 0;
                    this.lastFpsUpdate = 0;

                    this.totalShots = 0;
                    this.totalHits = 0;

                    document.getElementById('startBtn').onclick = () => this.toggle();
                    document.getElementById('resetBtn').onclick = () => this.reset();
                    document.getElementById('debugBtn').onclick = () => this.debug = !this.debug;

                    document.getElementById('tankCount').onchange = () => this.reset();
                    document.getElementById('dModel').onchange = () => this.reset();
                    document.getElementById('dState').onchange = () => this.reset();

                    this.spawn(6);
                    this.loop();
                }

                resize() {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width;
                    this.canvas.height = this.height;
                }

                spawn(count) {
                    this.tanks = [];
                    this.bullets = [];

                    for (let i = 0; i < count; i++) {
                        const x = 200 + Math.random() * (this.width - 400);
                        const y = 200 + Math.random() * (this.height - 400);
                        this.tanks.push(new Tank(
                            i, x, y,
                            this.colors[i % this.colors.length],
                            this
                        ));
                    }

                    this.totalShots = 0;
                    this.totalHits = 0;
                }

                toggle() {
                    this.running = !this.running;
                    document.getElementById('startBtn').textContent = this.running ? '⏸ ПАУЗА' : '▶ ПУСК';
                    document.getElementById('state').textContent = this.running ? 'БОЙ' : 'ГОТОВ';
                }

                reset() {
                    const count = parseInt(document.getElementById('tankCount').value);
                    this.spawn(count);
                    this.running = false;
                    document.getElementById('startBtn').textContent = '▶ ПУСК';
                    document.getElementById('state').textContent = 'ГОТОВ';
                }

                update() {
                    const now = performance.now();
                    
                    this.frameCount++;
                    if (now - this.lastFpsUpdate > 1000) {
                        this.fps = this.frameCount;
                        this.frameCount = 0;
                        this.lastFpsUpdate = now;
                    }
                    this.lastTime = now;

                    document.getElementById('fps').textContent = this.fps;
                    document.getElementById('totalShots').textContent = this.totalShots;
                    
                    const acc = this.totalShots > 0 ? Math.round(this.totalHits / this.totalShots * 100) : 0;
                    document.getElementById('accuracy').textContent = acc + '%';

                    this.ctx.clearRect(0, 0, this.width, this.height);

                    if (this.running) {
                        for (let tank of this.tanks) {
                            tank.update();
                        }

                        for (let i = this.bullets.length - 1; i >= 0; i--) {
                            const b = this.bullets[i];
                            b.x += b.vx;
                            b.y += b.vy;
                            b.life--;

                            this.ctx.beginPath();
                            this.ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                            this.ctx.strokeStyle = b.color;
                            this.ctx.lineWidth = 2;
                            this.ctx.stroke();

                            for (let tank of this.tanks) {
                                if (tank !== b.owner && tank.hp > 0) {
                                    const dx = b.x - tank.x;
                                    const dy = b.y - tank.y;
                                    if (dx * dx + dy * dy < (tank.radius + 5) ** 2) {
                                        tank.takeDamage(b.damage, b.owner);
                                        this.bullets.splice(i, 1);
                                        this.totalShots++;
                                        if (tank.hp <= 0) this.totalHits++;
                                        break;
                                    }
                                }
                            }

                            if (b.life <= 0) {
                                this.bullets.splice(i, 1);
                            }
                        }
                    }

                    for (let tank of this.tanks) {
                        tank.draw(this.ctx, this.debug);
                    }

                    this.updateUI();
                }

                updateUI() {
                    const active = this.tanks.filter(t => t.hp > 0).length;
                    document.getElementById('activeCount').textContent = `${active}/${this.tanks.length}`;

                    let totalLoss = 0;
                    let totalGrad = 0;
                    let count = 0;

                    let html = '';
                    for (let i = 0; i < this.tanks.length; i++) {
                        const t = this.tanks[i];
                        if (t.hp > 0) {
                            const acc = t.shots > 0 ? Math.round(t.hits / t.shots * 100) : 0;
                            totalLoss += t.brain.getLoss();
                            totalGrad += t.brain.getGradNorm();
                            count++;

                            html += `
                                <div class="tank-item">
                                    <div class="tank-header">
                                        <span>ТАНК-${i + 1}</span>
                                        <span>${t.brain.getLoss().toFixed(3)}</span>
                                    </div>
                                    <div class="tank-stats">
                                        <span>${acc}%</span>
                                        <span>${t.shots}</span>
                                        <span>${t.kills}</span>
                                    </div>
                                    <div class="health-bar">
                                        <div class="health-fill" style="width: ${t.hp}%"></div>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    document.getElementById('tankStats').innerHTML = html;

                    if (count > 0) {
                        document.getElementById('loss').textContent = (totalLoss / count).toFixed(3);
                        document.getElementById('gradNorm').textContent = (totalGrad / count).toFixed(3);
                    }

                    const dModel = parseInt(document.getElementById('dModel').value);
                    const dState = parseInt(document.getElementById('dState').value);
                    const neurons = this.tanks.length * (dModel + dState);
                    const params = this.tanks.length * (
                        dModel * 12 + dModel * dState * 3 + dState + dModel + dModel * 5
                    );

                    document.getElementById('neurons').textContent = neurons;
                    document.getElementById('params').textContent = Math.round(params / 1000) + 'K';
                }

                loop() {
                    this.update();
                    requestAnimationFrame(() => this.loop());
                }
            }

            // Запуск
            window.game = new GameEngine();
        })();
    </script>
