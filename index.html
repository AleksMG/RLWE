<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL MAMBA TANKS - ONLINE LEARNING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; background: #0a0a0a; }
        
        #ui {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }
        
        #settings {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,20,0,0.95);
            border: 2px solid #0f0; padding: 15px;
            color: #0f0; pointer-events: auto;
            min-width: 280px;
        }
        #settings h2 {
            font-size: 16px; margin-bottom: 10px;
            border-bottom: 2px solid #0f0; padding-bottom: 5px;
        }
        .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 13px; }
        select, input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; font-family: inherit; width: 100px; }
        .checkbox { width: auto; margin-right: 5px; }
        
        #stats {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,20,0,0.95);
            border: 2px solid #0f0; padding: 15px;
            color: #0f0; pointer-events: auto;
            min-width: 280px; max-height: 400px; overflow-y: auto;
        }
        #stats h2 {
            font-size: 16px; margin-bottom: 10px;
            border-bottom: 2px solid #0f0; padding-bottom: 5px;
        }
        .tank-info {
            margin: 6px 0; padding: 5px;
            background: rgba(0,50,0,0.3);
            border-left: 3px solid;
            cursor: pointer;
        }
        .tank-info:hover { background: rgba(0,100,0,0.5); }
        .hp-bar { width: 100%; height: 6px; background: #111; margin: 3px 0; }
        .hp-fill { height: 100%; transition: width 0.2s; }
        
        #controls {
            position: absolute; bottom: 20px; right: 20px;
            pointer-events: auto; display: flex; gap: 10px;
        }
        .btn {
            background: #0f0; color: #000;
            border: 2px solid #0f0; padding: 12px 25px;
            font-weight: bold; cursor: pointer;
            font-family: inherit; transition: 0.2s;
        }
        .btn:hover { background: #0a0; box-shadow: 0 0 20px #0f0; }
        .btn.danger { background: #f00; border-color: #f00; }
        .btn.danger:hover { background: #a00; }
        
        #info {
            position: absolute; bottom: 20px; left: 15px;
            background: rgba(0,20,0,0.9);
            border: 1px solid #0f0; padding: 10px;
            color: #0a0; font-size: 10px; line-height: 1.6;
            pointer-events: auto;
        }
        
        #learningPanel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,20,0,0.98);
            border: 3px solid #0f0; padding: 20px;
            color: #0f0; pointer-events: auto;
            min-width: 400px;
            display: none;
            z-index: 2000;
        }
        #learningPanel.show { display: block; }
        .close { float: right; cursor: pointer; font-size: 20px; }
        .progress-bar { width: 100%; height: 20px; background: #111; margin: 10px 0; }
        .progress-fill { height: 100%; background: #0f0; width: 0%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div id="settings">
            <h2>⚙️ MAMBA CONFIG</h2>
            <div class="row"><span>TANKS:</span>
                <select id="tankCount">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6" selected>6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div class="row"><span>MODEL SIZE:</span>
                <select id="modelSize">
                    <option value="8">8 (fast)</option>
                    <option value="16" selected>16 (medium)</option>
                    <option value="32">32 (slow)</option>
                </select>
            </div>
            <div class="row"><span>LEARN RATE:</span>
                <input type="number" id="learnRate" min="0.0001" max="0.1" step="0.0001" value="0.005">
            </div>
            <div class="row"><span>EXPLORE RATE:</span>
                <input type="number" id="exploreRate" min="0" max="1" step="0.05" value="0.2">
            </div>
            <div class="row"><span>REWARD HIT:</span>
                <input type="number" id="rewardHit" min="0" max="10" step="0.5" value="2.0">
            </div>
            <div class="row"><span>REWARD KILL:</span>
                <input type="number" id="rewardKill" min="0" max="20" step="1" value="5.0">
            </div>
        </div>
        
        <div id="stats">
            <h2>📊 LEARNING STATS</h2>
            <div id="tankStats"></div>
            <div style="margin-top:10px; padding-top:5px; border-top:1px solid #0f0">
                <div class="row"><span>TOTAL SHOTS:</span><span id="totalShots">0</span></div>
                <div class="row"><span>HIT RATIO:</span><span id="hitRatio">0%</span></div>
                <div class="row"><span>LEARN STEPS:</span><span id="learnSteps">0</span></div>
            </div>
        </div>
        
        <div id="controls">
            <button class="btn" id="startBtn">▶ START</button>
            <button class="btn" id="resetBtn">↻ RESET</button>
            <button class="btn" id="debugBtn">👁 DEBUG</button>
            <button class="btn" id="learnBtn">📚 LEARN</button>
        </div>
        
        <div id="info">
            > STATE: <span id="state">READY</span><br>
            > TANKS: <span id="tanks">0</span><br>
            > FPS: <span id="fps">0</span><br>
            > BRAIN: <span id="brainInfo">MAMBA 16x8</span>
        </div>
    </div>
    
    <div id="learningPanel">
        <span class="close" onclick="document.getElementById('learningPanel').classList.remove('show')">✖</span>
        <h3>📚 TRAINING PROGRESS</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="trainProgress" style="width:0%"></div>
        </div>
        <div id="trainStats"></div>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="game.startTraining()">START TRAINING</button>
    </div>

<script>
// ==================== НАСТОЯЩАЯ MAMBA (SSM) ====================
class MambaBlock {
    constructor(dModel = 16, dState = 8, dConv = 3, learnRate = 0.005) {
        this.dModel = dModel;      // размерность модели
        this.dState = dState;       // размер SSM состояния
        this.dConv = dConv;         // локальная свертка
        this.learningRate = learnRate;
        
        // SSM параметры (обучаемые!)
        this.A = this.randomMatrix(dState, dModel, 0.1);     // состояние->состояние
        this.B = this.randomMatrix(dModel, dState, 0.1);     // вход->состояние
        this.C = this.randomMatrix(dState, dModel, 0.1);     // состояние->выход
        this.D = this.randomMatrix(dModel, 1, 0.1);          // пропуск connection
        
        // Проекции
        this.W_in = this.randomMatrix(12, dModel, 0.1);      // сенсоры -> модель
        this.W_out = this.randomMatrix(dModel, 5, 0.1);      // модель -> действия
        
        // Convolution (для локальной обработки)
        this.conv1d = new Array(dConv).fill().map(() => 
            this.randomMatrix(dModel, dModel, 0.1)
        );
        
        // Состояния
        this.h = new Array(dState).fill(0);           // SSM состояние
        this.convBuffer = new Array(dConv).fill().map( // буфер для свертки
            () => new Array(dModel).fill(0)
        );
        this.convIdx = 0;
        
        // Для обучения
        this.step = 0;
        this.loss = 0;
    }
    
    randomMatrix(rows, cols, scale) {
        return Array(rows).fill().map(() => 
            Array(cols).fill().map(() => (Math.random() * 2 - 1) * scale)
        );
    }
    
    // Сигмоида с защитой от переполнения
    sigmoid(x) { 
        if (x > 20) return 1;
        if (x < -20) return 0;
        return 1 / (1 + Math.exp(-x)); 
    }
    
    // Дискретизация SSM (ZOH method)
    discretize(A, B, dt) {
        const Ad = Array(this.dState).fill().map(() => Array(this.dModel).fill(0));
        const Bd = Array(this.dModel).fill().map(() => Array(this.dState).fill(0));
        
        for (let i = 0; i < this.dState; i++) {
            for (let j = 0; j < this.dModel; j++) {
                Ad[i][j] = Math.exp(A[i][j] * dt);
            }
        }
        
        for (let i = 0; i < this.dModel; i++) {
            for (let j = 0; j < this.dState; j++) {
                Bd[i][j] = B[i][j] * (Math.exp(A[j][i] * dt) - 1) / (A[j][i] + 1e-8);
            }
        }
        
        return [Ad, Bd];
    }
    
    // SSM шаг
    ssmStep(x, dt = 0.1) {
        const [Ad, Bd] = this.discretize(this.A, this.B, dt);
        
        // Обновление состояния: h = Ad * h + Bd * x
        const newH = new Array(this.dState).fill(0);
        for (let i = 0; i < this.dState; i++) {
            let sum = 0;
            // Ad * h
            for (let j = 0; j < this.dState; j++) {
                sum += Ad[i][j] * this.h[j];
            }
            // Bd * x
            for (let j = 0; j < this.dModel; j++) {
                sum += Bd[j][i] * x[j];
            }
            newH[i] = Math.tanh(sum);
        }
        this.h = newH;
        
        // Выход: y = C * h + D * x
        const y = new Array(this.dModel).fill(0);
        for (let i = 0; i < this.dModel; i++) {
            for (let j = 0; j < this.dState; j++) {
                y[i] += this.C[j][i] * this.h[j];
            }
            y[i] += this.D[i][0] * x[i];
            y[i] = Math.tanh(y[i]);
        }
        
        return y;
    }
    
    // Convolution шаг
    convStep(x) {
        // Сохраняем в буфер
        this.convBuffer[this.convIdx] = [...x];
        
        // Применяем свертку по буферу
        const convOut = new Array(this.dModel).fill(0);
        for (let k = 0; k < this.dConv; k++) {
            const bufIdx = (this.convIdx - k + this.dConv) % this.dConv;
            if (this.convBuffer[bufIdx]) {
                for (let i = 0; i < this.dModel; i++) {
                    for (let j = 0; j < this.dModel; j++) {
                        convOut[i] += this.convBuffer[bufIdx][j] * this.conv1d[k][j][i];
                    }
                }
            }
        }
        
        this.convIdx = (this.convIdx + 1) % this.dConv;
        return convOut.map(v => Math.tanh(v));
    }
    
    // Forward pass
    forward(sensors) {
        // Входная проекция
        let x = new Array(this.dModel).fill(0);
        for (let i = 0; i < this.dModel; i++) {
            for (let j = 0; j < sensors.length; j++) {
                x[i] += sensors[j] * this.W_in[j][i];
            }
            x[i] = Math.tanh(x[i]);
        }
        
        // Convolution (локальная обработка последовательности)
        x = this.convStep(x);
        
        // SSM (глобальная память + время)
        x = this.ssmStep(x);
        
        // Выходная проекция -> действия
        const actions = new Array(5).fill(0);
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < this.dModel; j++) {
                actions[i] += x[j] * this.W_out[j][i];
            }
            actions[i] = Math.tanh(actions[i]);
        }
        
        this.step++;
        return actions;
    }
    
    // Обучение (упрощенный градиентный шаг)
    learn(reward, prevState, prevAction, exploreRate = 0.2) {
        if (Math.abs(reward) < 0.1) return 0;
        
        // Добавляем exploration noise
        const exploreNoise = (Math.random() < exploreRate) ? 0.1 : 0;
        
        // Обновляем выходные веса
        let totalLoss = 0;
        for (let i = 0; i < 5; i++) {
            // Цель: усилить выбранное действие, ослабить остальные
            const target = (i === prevAction) ? 1.0 : -1.0;
            const error = target - this.W_out[i];
            totalLoss += Math.abs(error);
            
            for (let j = 0; j < this.dModel; j++) {
                const grad = error * prevState[j] * reward;
                this.W_out[j][i] += this.learningRate * (grad + exploreNoise * (Math.random() - 0.5));
                // Clip weights
                this.W_out[j][i] = Math.max(-1, Math.min(1, this.W_out[j][i]));
            }
        }
        
        // Обновляем SSM параметры (немного)
        for (let i = 0; i < this.dState; i++) {
            for (let j = 0; j < this.dModel; j++) {
                this.A[i][j] += this.learningRate * reward * 0.01 * this.h[i] * (Math.random() - 0.5);
                this.B[j][i] += this.learningRate * reward * 0.01 * prevState[j] * (Math.random() - 0.5);
                this.C[i][j] += this.learningRate * reward * 0.01 * this.h[i] * (Math.random() - 0.5);
                this.D[j][0] += this.learningRate * reward * 0.01 * prevState[j] * (Math.random() - 0.5);
            }
        }
        
        this.loss = this.loss * 0.9 + totalLoss * 0.1;
        return totalLoss;
    }
    
    reset() {
        this.h = new Array(this.dState).fill(0);
        this.convBuffer = new Array(this.dConv).fill().map(
            () => new Array(this.dModel).fill(0)
        );
        this.convIdx = 0;
        this.step = 0;
        this.loss = 0;
    }
    
    getState() {
        return [...this.h];
    }
    
    getLoss() {
        return this.loss;
    }
}

// ==================== ВЕКТОРНАЯ МАТЕМАТИКА ====================
const V = {
    dist: (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2),
    angle: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
    normAngle: (a) => {
        while (a <= -Math.PI) a += Math.PI * 2;
        while (a > Math.PI) a -= Math.PI * 2;
        return a;
    }
};

// ==================== ПРЕДСКАЗАТЕЛЬ ДВИЖЕНИЯ ====================
class Predictor {
    constructor() {
        this.x = 0; this.y = 0;
        this.vx = 0; this.vy = 0;
        this.lastX = 0; this.lastY = 0;
        this.lastTime = 0;
        this.confidence = 0;
    }
    
    update(x, y) {
        const now = performance.now();
        
        if (this.lastTime === 0) {
            this.x = x; this.y = y;
            this.lastX = x; this.lastY = y;
            this.lastTime = now;
            this.confidence = 0.5;
            return;
        }
        
        const dt = Math.max(0.016, (now - this.lastTime) / 1000);
        
        // Скорость
        this.vx = (x - this.lastX) / dt;
        this.vy = (y - this.lastY) / dt;
        
        // Сглаживание
        this.vx = this.vx * 0.7 + this.vx * 0.3;
        this.vy = this.vy * 0.7 + this.vy * 0.3;
        
        this.x = x; this.y = y;
        this.lastX = x; this.lastY = y;
        this.lastTime = now;
        this.confidence = Math.min(1, this.confidence + 0.1);
    }
    
    predict(dt = 0.5) {
        if (this.confidence < 0.3) return null;
        return { x: this.x + this.vx * dt, y: this.y + this.vy * dt };
    }
    
    reset() {
        this.lastTime = 0;
        this.confidence = 0;
    }
}

// ==================== ТАНК ====================
class Tank {
    constructor(id, x, y, color, game) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.color = color;
        this.game = game;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 0;
        this.maxSpeed = 3.0;
        this.radius = 20;
        this.hp = 100;
        this.cooldown = 0;
        
        // Нейросеть
        const modelSize = parseInt(document.getElementById('modelSize').value);
        const learnRate = parseFloat(document.getElementById('learnRate').value);
        this.brain = new MambaBlock(modelSize, Math.floor(modelSize/2), 3, learnRate);
        this.predictors = {};
        
        // Зрение
        this.visionAngle = 30 * Math.PI / 180;
        this.visionDistance = 250;
        this.targets = [];
        
        // Статистика
        this.shots = 0;
        this.hits = 0;
        this.kills = 0;
        this.lastBrainState = null;
        this.lastAction = 0;
        
        // Обучение
        this.experience = [];
        this.maxExp = 100;
    }
    
    canSee(target) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > this.visionDistance || dist < 40) return false;
        
        const angleToTarget = Math.atan2(dy, dx);
        const angleDiff = V.normAngle(angleToTarget - this.angle);
        
        return Math.abs(angleDiff) < this.visionAngle / 2;
    }
    
    getSensors() {
        const s = [];
        this.targets = [];
        
        // 1-3: Дистанция до стен
        s.push(this.raycast(this.angle) / this.visionDistance);
        s.push(this.raycast(this.angle - 0.7) / this.visionDistance);
        s.push(this.raycast(this.angle + 0.7) / this.visionDistance);
        
        // 4-10: Ближайший враг
        let nearest = null;
        let minDist = Infinity;
        
        this.game.tanks.forEach(t => {
            if (t !== this && t.hp > 0 && this.canSee(t)) {
                this.targets.push(t);
                const d = V.dist(this, t);
                if (d < minDist) { minDist = d; nearest = t; }
            }
        });
        
        if (nearest) {
            s.push(minDist / this.visionDistance);
            
            const angleToEnemy = V.normAngle(Math.atan2(nearest.y - this.y, nearest.x - this.x) - this.angle);
            s.push(angleToEnemy / Math.PI);
            s.push(nearest.speed / this.maxSpeed);
            s.push(Math.cos(nearest.angle));
            s.push(Math.sin(nearest.angle));
            
            // Предсказание
            if (!this.predictors[nearest.id]) this.predictors[nearest.id] = new Predictor();
            const pred = this.predictors[nearest.id].predict(0.5);
            
            if (pred) {
                const predAngle = V.normAngle(Math.atan2(pred.y - this.y, pred.x - this.x) - this.angle);
                s.push(predAngle / Math.PI);
                s.push(V.dist(this, pred) / this.visionDistance);
            } else {
                s.push(0, 1);
            }
        } else {
            s.push(1, 0, 0, 1, 0, 1);
        }
        
        // 11-13: Своё состояние
        s.push(this.speed / this.maxSpeed);
        s.push(Math.sin(this.angle));
        s.push(Math.cos(this.angle));
        
        return s;
    }
    
    raycast(angle, maxDist = 400) {
        const step = 15;
        let dist = 0;
        let x = this.x, y = this.y;
        
        while (dist < maxDist) {
            x += Math.cos(angle) * step;
            y += Math.sin(angle) * step;
            dist += step;
            
            if (x < 0 || x > this.game.width || y < 0 || y > this.game.height) return dist;
            
            for (let t of this.game.tanks) {
                if (t !== this && t.hp > 0 && V.dist({x, y}, t) < t.radius) return dist;
            }
        }
        return maxDist;
    }
    
    update() {
        if (this.hp <= 0) return;
        
        // Обновление предсказателей
        this.game.tanks.forEach(t => {
            if (t !== this && t.hp > 0) {
                if (!this.predictors[t.id]) this.predictors[t.id] = new Predictor();
                this.predictors[t.id].update(t.x, t.y);
            }
        });
        
        // Нейросеть
        const sensors = this.getSensors();
        const outputs = this.brain.forward(sensors);
        
        // Запоминаем состояние ДО действия
        this.lastBrainState = this.brain.getState();
        this.lastAction = outputs.indexOf(Math.max(...outputs));
        
        // Действия из нейросети
        const move = outputs[0];
        const turn = outputs[1];
        const fire = outputs[2];
        
        // === ДВИЖЕНИЕ ===
        if (this.targets.length > 0) {
            const target = this.targets[0];
            const distToTarget = V.dist(this, target);
            
            // Газ
            if (move > 0.1) {
                this.speed = Math.min(this.speed + 0.2, this.maxSpeed);
            } else if (move < -0.1) {
                this.speed = Math.max(this.speed - 0.15, -this.maxSpeed * 0.5);
            } else {
                this.speed = Math.min(this.speed + 0.1, this.maxSpeed * 0.5);
            }
            
            // Поворот к цели + нейросеть
            const angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
            const angleDiff = V.normAngle(angleToTarget - this.angle);
            
            if (Math.abs(angleDiff) > 0.2) {
                this.angle += Math.sign(angleDiff) * 0.06;
            }
            this.angle += turn * 0.06;
            
            // Дистанция
            if (distToTarget < 100) this.speed *= 0.9;
            if (distToTarget > 200) this.speed = Math.min(this.speed + 0.1, this.maxSpeed);
            
        } else {
            // Патрулирование
            if (move > 0) {
                this.speed = Math.min(this.speed + 0.15, this.maxSpeed * 0.7);
            } else {
                this.speed = Math.min(this.speed + 0.08, this.maxSpeed * 0.4);
            }
            
            this.angle += turn * 0.06 + (Math.random() - 0.5) * 0.03;
            
            // Избегание стен
            const frontDist = this.raycast(this.angle);
            if (frontDist < 100) {
                this.angle += 0.15;
                this.speed *= 0.7;
            }
        }
        
        // Трение
        this.speed *= 0.96;
        
        // Физика
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        
        // Границы
        const margin = this.radius + 5;
        if (this.x < margin) {
            this.x = margin;
            this.angle = Math.PI - this.angle + (Math.random() - 0.5) * 0.5;
            this.speed *= 0.5;
        }
        if (this.x > this.game.width - margin) {
            this.x = this.game.width - margin;
            this.angle = Math.PI - this.angle + (Math.random() - 0.5) * 0.5;
            this.speed *= 0.5;
        }
        if (this.y < margin) {
            this.y = margin;
            this.angle = -this.angle + (Math.random() - 0.5) * 0.5;
            this.speed *= 0.5;
        }
        if (this.y > this.game.height - margin) {
            this.y = this.game.height - margin;
            this.angle = -this.angle + (Math.random() - 0.5) * 0.5;
            this.speed *= 0.5;
        }
        
        // Коллизии с танками
        this.game.tanks.forEach(other => {
            if (other !== this && other.hp > 0) {
                const dist = V.dist(this, other);
                const minDist = this.radius + other.radius;
                
                if (dist < minDist) {
                    const pushAngle = Math.atan2(this.y - other.y, this.x - other.x);
                    const overlap = (minDist - dist) / 2 + 1;
                    
                    this.x += Math.cos(pushAngle) * overlap;
                    this.y += Math.sin(pushAngle) * overlap;
                    this.speed *= 0.5;
                }
            }
        });
        
        // Стрельба
        if (this.cooldown > 0) this.cooldown--;
        
        if (fire > 0.5 && this.cooldown <= 0 && this.targets.length > 0) {
            this.shoot();
        }
    }
    
    shoot() {
        if (this.targets.length === 0) return;
        const target = this.targets[0];
        
        // Честное упреждение на основе физики
        const dist = V.dist(this, target);
        const bulletSpeed = 12;
        const timeToHit = dist / bulletSpeed;
        
        // Предсказание позиции через время полета пули
        const targetX = target.x + Math.cos(target.angle) * target.speed * timeToHit * 1.2;
        const targetY = target.y + Math.sin(target.angle) * target.speed * timeToHit * 1.2;
        
        const fireAngle = Math.atan2(targetY - this.y, targetX - this.x);
        
        this.game.bullets.push({
            x: this.x + Math.cos(this.angle) * 30,
            y: this.y + Math.sin(this.angle) * 30,
            vx: Math.cos(fireAngle) * bulletSpeed,
            vy: Math.sin(fireAngle) * bulletSpeed,
            color: this.color,
            owner: this
        });
        
        this.cooldown = 30;
        this.shots++;
    }
    
    takeDamage(amount, attacker) {
        this.hp -= amount;
        if (attacker) {
            attacker.hits++;
            
            // НАГРАДА ЗА ПОПАДАНИЕ
            const rewardHit = parseFloat(document.getElementById('rewardHit').value);
            if (attacker.lastBrainState) {
                const exploreRate = parseFloat(document.getElementById('exploreRate').value);
                attacker.brain.learn(rewardHit, attacker.lastBrainState, attacker.lastAction, exploreRate);
                
                // Сохраняем опыт
                attacker.experience.push({
                    state: attacker.lastBrainState,
                    action: attacker.lastAction,
                    reward: rewardHit
                });
                if (attacker.experience.length > attacker.maxExp) {
                    attacker.experience.shift();
                }
            }
        }
        
        if (this.hp <= 0) {
            if (attacker) {
                attacker.kills++;
                
                // НАГРАДА ЗА УБИЙСТВО
                const rewardKill = parseFloat(document.getElementById('rewardKill').value);
                if (attacker.lastBrainState) {
                    const exploreRate = parseFloat(document.getElementById('exploreRate').value);
                    attacker.brain.learn(rewardKill, attacker.lastBrainState, attacker.lastAction, exploreRate);
                    
                    attacker.experience.push({
                        state: attacker.lastBrainState,
                        action: attacker.lastAction,
                        reward: rewardKill
                    });
                }
            }
            
            this.hp = 0;
            
            setTimeout(() => {
                this.hp = 100;
                this.x = 150 + Math.random() * (this.game.width - 300);
                this.y = 150 + Math.random() * (this.game.height - 300);
                this.speed = 0;
                this.angle = Math.random() * Math.PI * 2;
                this.brain.reset();
                this.predictors = {};
                this.experience = [];
            }, 2000);
        }
    }
    
    draw(ctx, debug) {
        if (this.hp <= 0) return;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        
        // Корпус
        ctx.fillStyle = this.color;
        ctx.fillRect(-22, -16, 44, 32);
        
        // Башня
        ctx.fillStyle = '#fff';
        ctx.fillRect(-8, -8, 16, 16);
        
        // Пушка
        ctx.fillStyle = '#ccc';
        ctx.fillRect(0, -5, 28, 10);
        
        ctx.restore();
        
        // HP bar
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x - 25, this.y - 40, 50, 6);
        ctx.fillStyle = this.hp > 30 ? this.color : '#f00';
        ctx.fillRect(this.x - 25, this.y - 40, 50 * (this.hp / 100), 6);
        
        // DEBUG
        if (debug) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            // Конус зрения
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.visionDistance);
            gradient.addColorStop(0, 'rgba(0,255,0,0.2)');
            gradient.addColorStop(1, 'rgba(0,255,0,0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, this.visionDistance, -this.visionAngle / 2, this.visionAngle / 2);
            ctx.closePath();
            ctx.fill();
            
            // Loss
            ctx.fillStyle = '#ff0';
            ctx.font = '10px monospace';
            ctx.fillText('L:' + this.brain.getLoss().toFixed(3), -20, -50);
            
            ctx.restore();
        }
    }
}

// ==================== ИГРОВОЙ ДВИЖОК ====================
class GameEngine {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        
        this.tanks = [];
        this.bullets = [];
        this.running = false;
        this.debug = true;
        this.training = false;
        
        this.colors = ['#0ff','#f0f','#ff0','#0f0','#f00','#00f','#fa0','#808','#088','#f6f'];
        
        this.lastFrameTime = performance.now();
        this.fps = 0;
        this.totalShots = 0;
        this.totalHits = 0;
        this.learnSteps = 0;
        
        window.addEventListener('resize', () => {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.canvas.width = this.width;
            this.canvas.height = this.height;
        });
        
        // UI Events
        document.getElementById('startBtn').onclick = () => this.toggle();
        document.getElementById('resetBtn').onclick = () => this.reset();
        document.getElementById('debugBtn').onclick = () => this.toggleDebug();
        document.getElementById('learnBtn').onclick = () => this.showLearningPanel();
        
        document.getElementById('tankCount').onchange = () => this.reset();
        document.getElementById('modelSize').onchange = () => this.reset();
        document.getElementById('learnRate').onchange = () => this.updateLearnRate();
        
        this.spawn(6);
        this.loop();
    }
    
    spawn(count) {
        this.tanks = [];
        this.bullets = [];
        
        for (let i = 0; i < count; i++) {
            const x = 200 + Math.random() * (this.width - 400);
            const y = 200 + Math.random() * (this.height - 400);
            this.tanks.push(new Tank(i, x, y, this.colors[i % this.colors.length], this));
        }
        
        document.getElementById('tanks').textContent = count;
        this.totalShots = 0;
        this.totalHits = 0;
        this.learnSteps = 0;
    }
    
    toggle() {
        this.running = !this.running;
        const btn = document.getElementById('startBtn');
        const state = document.getElementById('state');
        
        if (this.running) {
            btn.textContent = '⏸ PAUSE';
            state.textContent = 'RUNNING';
            state.style.color = '#0f0';
        } else {
            btn.textContent = '▶ START';
            state.textContent = 'PAUSED';
            state.style.color = '#ff0';
        }
    }
    
    reset() {
        const count = parseInt(document.getElementById('tankCount').value);
        this.bullets = [];
        this.spawn(count);
        this.running = false;
        
        document.getElementById('startBtn').textContent = '▶ START';
        document.getElementById('state').textContent = 'READY';
        document.getElementById('state').style.color = '#0ff';
    }
    
    toggleDebug() {
        this.debug = !this.debug;
    }
    
    updateLearnRate() {
        const rate = parseFloat(document.getElementById('learnRate').value);
        this.tanks.forEach(t => t.brain.learningRate = rate);
    }
    
    showLearningPanel() {
        const panel = document.getElementById('learningPanel');
        panel.classList.add('show');
        this.updateTrainingStats();
    }
    
    updateTrainingStats() {
        let totalLoss = 0;
        let totalExp = 0;
        this.tanks.forEach(t => {
            totalLoss += t.brain.getLoss();
            totalExp += t.experience.length;
        });
        
        document.getElementById('trainStats').innerHTML = `
            <div>AVG LOSS: ${(totalLoss / this.tanks.length).toFixed(4)}</div>
            <div>TOTAL EXPERIENCE: ${totalExp}</div>
            <div>HIT RATIO: ${this.totalShots ? Math.round(this.totalHits / this.totalShots * 100) : 0}%</div>
        `;
    }
    
    update() {
        const now = performance.now();
        this.fps = Math.round(1000 / (now - this.lastFrameTime));
        this.lastFrameTime = now;
        document.getElementById('fps').textContent = this.fps;
        
        // Очистка
        this.ctx.fillStyle = 'rgba(10, 10, 10, 0.4)';
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        // Сетка
        this.ctx.strokeStyle = '#1a1a1a';
        this.ctx.lineWidth = 1;
        for (let x = 0; x < this.width; x += 60) {
            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.height);
            this.ctx.stroke();
        }
        for (let y = 0; y < this.height; y += 60) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.width, y);
            this.ctx.stroke();
        }
        
        if (this.running) {
            // Танки
            this.tanks.forEach(t => t.update());
            
            // Пули
            for (let i = this.bullets.length - 1; i >= 0; i--) {
                const b = this.bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                
                this.ctx.beginPath();
                this.ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                this.ctx.fillStyle = b.color;
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = b.color;
                this.ctx.fill();
                this.ctx.shadowBlur = 0;
                
                let hit = false;
                this.tanks.forEach(t => {
                    if (t !== b.owner && t.hp > 0 && V.dist({x: b.x, y: b.y}, t) < t.radius + 5) {
                        t.takeDamage(12, b.owner);
                        hit = true;
                        this.totalShots++;
                        this.totalHits++;
                    }
                });
                
                if (hit || b.x < 0 || b.x > this.width || b.y < 0 || b.y > this.height) {
                    this.bullets.splice(i, 1);
                }
            }
            
            // Обучение на опыте
            if (this.training && Math.random() < 0.1) {
                this.tanks.forEach(t => {
                    if (t.experience.length > 10) {
                        const exp = t.experience[Math.floor(Math.random() * t.experience.length)];
                        t.brain.learn(exp.reward * 0.5, exp.state, exp.action);
                        this.learnSteps++;
                    }
                });
            }
        }
        
        // Танки
        this.tanks.forEach(t => t.draw(this.ctx, this.debug));
        
        // UI
        this.updateUI();
        document.getElementById('brainInfo').textContent = 
            `MAMBA ${document.getElementById('modelSize').value}x${Math.floor(document.getElementById('modelSize').value/2)}`;
    }
    
    updateUI() {
        let html = '';
        this.tanks.forEach((t, i) => {
            if (t.hp > 0) {
                const acc = t.shots > 0 ? Math.round(t.hits / t.shots * 100) : 0;
                html += `
                    <div class="tank-info" style="border-color:${t.color}" onclick="game.tanks[${i}].brain.learn(1, game.tanks[${i}].lastBrainState, game.tanks[${i}].lastAction)">
                        <div style="color:${t.color};font-weight:bold">T${i+1} | L:${t.brain.getLoss().toFixed(3)}</div>
                        <div class="hp-bar">
                            <div class="hp-fill" style="width:${t.hp}%;background:${t.color}"></div>
                        </div>
                        <div style="font-size:9px;color:#0a0">ACC:${acc}% S:${t.shots} K:${t.kills} EXP:${t.experience.length}</div>
                    </div>
                `;
            }
        });
        document.getElementById('tankStats').innerHTML = html;
        
        document.getElementById('totalShots').textContent = this.totalShots;
        document.getElementById('hitRatio').textContent = this.totalShots ? Math.round(this.totalHits / this.totalShots * 100) + '%' : '0%';
        document.getElementById('learnSteps').textContent = this.learnSteps;
    }
    
    loop() {
        this.update();
        requestAnimationFrame(() => this.loop());
    }
}

// ЗАПУСК
const game = new GameEngine();
console.log('✓ REAL MAMBA TANKS - ONLINE LEARNING');
