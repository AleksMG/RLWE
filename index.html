<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN Мозг Муравья с 6 лапами</title>
    <style>
        body {
            background: #1a2f1a;
            color: #7cfc00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #brainCanvas {
            background: #0a1a0a;
            border: 4px solid #7cfc00;
            border-radius: 10px;
            box-shadow: 0 0 30px #7cfc00;
        }
        
        #antCanvas {
            background: #2a3f2a;
            border: 4px solid #7cfc00;
            border-radius: 10px;
        }
        
        .panel {
            background: #0a1a0a;
            border: 4px solid #7cfc00;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }
        
        .leg-control {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 5px;
            background: #1a2f1a;
            border-radius: 5px;
        }
        
        .leg-number {
            width: 30px;
            font-weight: bold;
        }
        
        .leg-angle {
            width: 60px;
            text-align: center;
            color: #ff0;
        }
        
        .leg-bar {
            flex-grow: 1;
            height: 20px;
            background: #2a3f2a;
            margin: 0 10px;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .leg-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7cfc00, #ff0);
            transition: width 0.05s;
        }
        
        .neuron-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        
        .neuron-cell {
            background: #1a2f1a;
            padding: 5px;
            text-align: center;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .spike-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        
        button {
            background: #1a2f1a;
            color: #7cfc00;
            border: 2px solid #7cfc00;
            padding: 10px;
            margin: 5px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        button:hover {
            background: #7cfc00;
            color: #1a2f1a;
        }
        
        .brain-part {
            background: #1a2f1a;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #7cfc00;
        }
    </style>
</head>
<body>
    <h1>🧠 SNN МОЗГ МУРАВЬЯ (6 ЛАП) 🐜</h1>
    
    <div class="container">
        <!-- Мозг SNN -->
        <canvas id="brainCanvas" width="600" height="600"></canvas>
        
        <!-- Муравей -->
        <canvas id="antCanvas" width="400" height="400"></canvas>
    </div>
    
    <div style="display: flex; width: 100%; justify-content: center;">
        <div class="panel">
            <h3>🦵 УПРАВЛЕНИЕ ЛАПАМИ</h3>
            
            <div id="legControls">
                <!-- Заполняется JS -->
            </div>
            
            <div class="brain-part">
                <h4>🧠 АКТИВНОСТЬ МОЗГА</h4>
                <div class="neuron-stats" id="brainActivity">
                    <!-- Заполняется JS -->
                </div>
            </div>
            
            <div class="brain-part">
                <h4>🎮 РЕЖИМЫ ДВИЖЕНИЯ</h4>
                <button onclick="setGait('walk')">🚶 Ходьба</button>
                <button onclick="setGait('turnLeft')">⬅️ Поворот налево</button>
                <button onclick="setGait('turnRight')">➡️ Поворот направо</button>
                <button onclick="setGait('stop')">⏹️ Стоп</button>
                <button onclick="randomStimulus()">🎲 Случайный стимул</button>
                <button onclick="resetBrain()">🔄 Сброс мозга</button>
            </div>
            
            <div>
                <h4>📊 СТАТУС</h4>
                <div>Время: <span id="time">0</span></div>
                <div>Спайков/сек: <span id="spikeRate">0</span></div>
                <div>Режим: <span id="currentGait">ходьба</span></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // LIF НЕЙРОН (реальный, не симуляция)
        // ============================================
        class LIFNeuron {
            constructor(id, type, x, y, threshold = 1.0, leak = 0.85) {
                this.id = id;
                this.type = type; // 'sensory', 'motor', 'inter', 'command'
                this.x = x;
                this.y = y;
                
                // Параметры нейрона
                this.potential = 0.0;
                this.threshold = threshold;
                this.leak = leak;
                this.reset = 0.0;
                this.refractory = 0;
                this.refractoryPeriod = 2;
                
                // Состояние
                this.spiked = false;
                this.lastSpikeTime = -100;
                this.firingRate = 0;
                
                // Входы/выходы
                this.inputs = []; // {synapse, weight}
                this.outputs = [];
                
                // Для статистики
                this.spikeCount = 0;
                this.activity = 0;
            }
            
            addInput(neuron, weight = 0.3, delay = 1) {
                const synapse = new Synapse(neuron, this, weight, delay);
                this.inputs.push({synapse, neuron});
                return synapse;
            }
            
            addOutput(neuron, weight = 0.3, delay = 1) {
                const synapse = new Synapse(this, neuron, weight, delay);
                this.outputs.push({synapse, neuron});
                return synapse;
            }
            
            step(currentTime, externalInput = 0) {
                // Рефрактерность
                if (this.refractory > 0) {
                    this.refractory--;
                    this.spiked = false;
                    return 0;
                }
                
                // Суммируем входы от синапсов
                let inputSum = externalInput;
                for (let inp of this.inputs) {
                    inputSum += inp.synapse.getOutput();
                }
                
                // Обновляем потенциал (LIF)
                this.potential = this.potential * this.leak + inputSum;
                
                // Проверка порога
                if (this.potential >= this.threshold) {
                    this.spiked = true;
                    this.lastSpikeTime = currentTime;
                    this.spikeCount++;
                    this.potential = this.reset;
                    this.refractory = this.refractoryPeriod;
                    
                    // Рассылаем спайк по выходам
                    for (let out of this.outputs) {
                        out.synapse.receiveSpike(this.potential);
                    }
                    
                    return 1; // Спайк
                }
                
                this.spiked = false;
                return 0;
            }
            
            getActivity() {
                // Активность за последние 10 шагов
                return this.spiked ? 1 : 0;
            }
        }

        // ============================================
        // СИНАПС
        // ============================================
        class Synapse {
            constructor(pre, post, weight, delay = 1) {
                this.pre = pre;
                this.post = post;
                this.weight = weight;
                this.delay = delay;
                this.buffer = new Array(delay + 1).fill(0);
                this.strength = weight; // Для пластичности
            }
            
            receiveSpike(value) {
                // Получаем спайк от пресинаптического нейрона
                this.buffer[0] = value * this.weight;
            }
            
            step() {
                // Сдвигаем буфер
                for (let i = this.buffer.length - 1; i > 0; i--) {
                    this.buffer[i] = this.buffer[i-1];
                }
                this.buffer[0] = 0;
            }
            
            getOutput() {
                return this.buffer[this.buffer.length - 1];
            }
        }

        // ============================================
        // ЛАПА МУРАВЬЯ
        // ============================================
        class Leg {
            constructor(index, side) {
                this.index = index;
                this.side = side; // 'left' или 'right'
                this.position = index; // 0-2 для передней/средней/задней
                
                // Углы суставов (в градусах)
                this.coxa = 0;    // Базовый сустав (вверх-вниз)
                this.femur = 45;  // Средний сустав
                this.tibia = 90;  // Нижний сустав
                
                // Целевые углы (от моторных нейронов)
                this.targetCoxa = 0;
                this.targetFemur = 45;
                this.targetTibia = 90;
                
                // Скорость движения
                this.speed = 2;
                
                // Фаза шага (для ходьбы)
                this.phase = index * 0.5; // Сдвиг фаз между лапами
            }
            
            update(motorSignals) {
                // Получаем сигналы от моторных нейронов
                // motorSignals: [coxaL, coxaR, femurL, femurR, tibiaL, tibiaR]
                
                // Обновляем целевые углы
                if (this.side === 'left') {
                    this.targetCoxa = motorSignals[0] * 90;
                    this.targetFemur = 45 + motorSignals[2] * 90;
                    this.targetTibia = 90 + motorSignals[4] * 90;
                } else {
                    this.targetCoxa = motorSignals[1] * 90;
                    this.targetFemur = 45 + motorSignals[3] * 90;
                    this.targetTibia = 90 + motorSignals[5] * 90;
                }
                
                // Плавно двигаем к цели
                this.coxa += (this.targetCoxa - this.coxa) * 0.1;
                this.femur += (this.targetFemur - this.femur) * 0.1;
                this.tibia += (this.targetTibia - this.tibia) * 0.1;
                
                // Ограничения
                this.coxa = Math.max(-45, Math.min(45, this.coxa));
                this.femur = Math.max(0, Math.min(180, this.femur));
                this.tibia = Math.max(0, Math.min(180, this.tibia));
            }
            
            getAngles() {
                return {
                    coxa: this.coxa,
                    femur: this.femur,
                    tibia: this.tibia
                };
            }
        }

        // ============================================
        // МОЗГ МУРАВЬЯ (SNN)
        // ============================================
        class AntBrain {
            constructor() {
                this.neurons = [];
                this.synapses = [];
                this.time = 0;
                
                this.createBrain();
                this.connectBrain();
            }
            
            createBrain() {
                // === СЕНСОРНЫЕ НЕЙРОНЫ (вход) ===
                // Зрение (4 нейрона)
                for (let i = 0; i < 4; i++) {
                    this.neurons.push(new LIFNeuron(
                        `vision_${i}`, 'sensory', 
                        100 + i*80, 100, 0.8
                    ));
                }
                
                // Тактильные (6 нейронов - по одному на лапу)
                for (let i = 0; i < 6; i++) {
                    this.neurons.push(new LIFNeuron(
                        `touch_${i}`, 'sensory', 
                        100 + (i%3)*80, 200 + Math.floor(i/3)*60, 0.7
                    ));
                }
                
                // Проприоцепция (положение лап)
                for (let i = 0; i < 6; i++) {
                    this.neurons.push(new LIFNeuron(
                        `prop_${i}`, 'sensory', 
                        100 + (i%3)*80, 320 + Math.floor(i/3)*60, 0.6
                    ));
                }
                
                // === ЦЕНТРАЛЬНЫЙ ПАТТЕРН-ГЕНЕРАТОР (CPG) ===
                // Нейроны для генерации ритма ходьбы
                for (let i = 0; i < 6; i++) {
                    this.neurons.push(new LIFNeuron(
                        `cpg_${i}`, 'inter', 
                        300 + i*40, 200, 0.9, 0.8
                    ));
                }
                
                // === КОМАНДНЫЕ НЕЙРОНЫ ===
                const commands = ['walk', 'turnLeft', 'turnRight', 'stop', 'fast', 'slow'];
                for (let i = 0; i < commands.length; i++) {
                    this.neurons.push(new LIFNeuron(
                        `cmd_${commands[i]}`, 'command', 
                        450, 100 + i*60, 0.5
                    ));
                }
                
                // === МОТОРНЫЕ НЕЙРОНЫ (выход) ===
                // Для каждой лапы: поднять/опустить, вперед/назад
                // 6 лап * 3 сустава * 2 стороны = 36 моторных нейронов
                for (let leg = 0; leg < 6; leg++) {
                    for (let joint = 0; joint < 3; joint++) { // coxa, femur, tibia
                        for (let dir = 0; dir < 2; dir++) { // flex/extend
                            this.neurons.push(new LIFNeuron(
                                `motor_${leg}_${joint}_${dir}`, 'motor',
                                500 + joint*80, 250 + leg*40, 0.7
                            ));
                        }
                    }
                }
            }
            
            connectBrain() {
                // Связываем сенсоры с CPG
                for (let i = 0; i < 6; i++) {
                    const cpg = this.getNeuron(`cpg_${i}`);
                    const touch = this.getNeuron(`touch_${i}`);
                    if (cpg && touch) {
                        touch.addOutput(cpg, 0.5, 2);
                    }
                }
                
                // Связываем CPG между собой (для генерации паттерна)
                for (let i = 0; i < 6; i++) {
                    const cpg1 = this.getNeuron(`cpg_${i}`);
                    const cpg2 = this.getNeuron(`cpg_${(i+1)%6}`);
                    const cpg3 = this.getNeuron(`cpg_${(i+3)%6}`);
                    if (cpg1 && cpg2) {
                        cpg1.addOutput(cpg2, 0.3, 3);
                        cpg1.addOutput(cpg3, -0.2, 4); // Торможение противоположной
                    }
                }
                
                // Связываем команды с CPG
                const walk = this.getNeuron('cmd_walk');
                const turnL = this.getNeuron('cmd_turnLeft');
                const turnR = this.getNeuron('cmd_turnRight');
                
                for (let i = 0; i < 6; i++) {
                    const cpg = this.getNeuron(`cpg_${i}`);
                    if (walk && cpg) walk.addOutput(cpg, 0.4, 1);
                    if (turnL && cpg) turnL.addOutput(cpg, i < 3 ? 0.6 : -0.3, 1);
                    if (turnR && cpg) turnR.addOutput(cpg, i >= 3 ? 0.6 : -0.3, 1);
                }
                
                // Связываем CPG с моторными нейронами
                for (let leg = 0; leg < 6; leg++) {
                    const cpg = this.getNeuron(`cpg_${leg}`);
                    
                    for (let joint = 0; joint < 3; joint++) {
                        const motorFlex = this.getNeuron(`motor_${leg}_${joint}_0`);
                        const motorExt = this.getNeuron(`motor_${leg}_${joint}_1`);
                        
                        if (cpg && motorFlex && motorExt) {
                            // Прямые и перекрестные связи для создания ритма
                            cpg.addOutput(motorFlex, 0.5, 2);
                            cpg.addOutput(motorExt, -0.3, 2);
                            
                            // Связи между суставами для координации
                            if (joint > 0) {
                                const prevFlex = this.getNeuron(`motor_${leg}_${joint-1}_0`);
                                if (prevFlex) prevFlex.addOutput(motorFlex, 0.2, 1);
                            }
                        }
                    }
                }
            }
            
            getNeuron(id) {
                return this.neurons.find(n => n.id === id);
            }
            
            step(externalStimulus = {}) {
                this.time++;
                
                // Внешние стимулы
                if (externalStimulus.walk) {
                    const walkNeuron = this.getNeuron('cmd_walk');
                    if (walkNeuron) walkNeuron.step(this.time, 1.0);
                }
                
                if (externalStimulus.touch) {
                    for (let i = 0; i < externalStimulus.touch.length; i++) {
                        if (externalStimulus.touch[i] > 0) {
                            const touchNeuron = this.getNeuron(`touch_${i}`);
                            if (touchNeuron) touchNeuron.step(this.time, externalStimulus.touch[i]);
                        }
                    }
                }
                
                // Шаг всех нейронов
                let spikes = 0;
                for (let neuron of this.neurons) {
                    spikes += neuron.step(this.time);
                }
                
                // Шаг всех синапсов
                for (let neuron of this.neurons) {
                    for (let out of neuron.outputs) {
                        out.synapse.step();
                    }
                }
                
                return spikes;
            }
            
            getMotorOutputs() {
                // Получаем сигналы от моторных нейронов
                const motors = new Array(36).fill(0);
                
                for (let leg = 0; leg < 6; leg++) {
                    for (let joint = 0; joint < 3; joint++) {
                        for (let dir = 0; dir < 2; dir++) {
                            const neuron = this.getNeuron(`motor_${leg}_${joint}_${dir}`);
                            if (neuron && neuron.spiked) {
                                const idx = leg * 6 + joint * 2 + dir;
                                motors[idx] = 1.0;
                            }
                        }
                    }
                }
                
                // Преобразуем в сигналы для каждой лапы
                // Формат: [coxaL, coxaR, femurL, femurR, tibiaL, tibiaR]
                const legSignals = new Array(6).fill(0);
                
                for (let leg = 0; leg < 6; leg++) {
                    // Суммируем сигналы для каждого сустава
                    let coxa = 0, femur = 0, tibia = 0;
                    
                    for (let dir = 0; dir < 2; dir++) {
                        const coxaNeuron = this.getNeuron(`motor_${leg}_0_${dir}`);
                        const femurNeuron = this.getNeuron(`motor_${leg}_1_${dir}`);
                        const tibiaNeuron = this.getNeuron(`motor_${leg}_2_${dir}`);
                        
                        if (coxaNeuron && coxaNeuron.spiked) coxa += dir === 0 ? 0.5 : -0.5;
                        if (femurNeuron && femurNeuron.spiked) femur += dir === 0 ? 0.5 : -0.5;
                        if (tibiaNeuron && tibiaNeuron.spiked) tibia += dir === 0 ? 0.5 : -0.5;
                    }
                    
                    legSignals[leg] = {coxa, femur, tibia};
                }
                
                return legSignals;
            }
        }

        // ============================================
        // МУРАВЕЙ
        // ============================================
        class Ant {
            constructor() {
                this.legs = [];
                
                // Создаем 6 лап (3 левых, 3 правых)
                for (let i = 0; i < 3; i++) {
                    this.legs.push(new Leg(i, 'left'));
                }
                for (let i = 0; i < 3; i++) {
                    this.legs.push(new Leg(i, 'right'));
                }
                
                this.bodyX = 200;
                this.bodyY = 200;
                this.bodyAngle = 0;
                this.headAngle = 0;
            }
            
            update(brainOutputs) {
                // Обновляем лапы
                for (let i = 0; i < this.legs.length; i++) {
                    this.legs[i].update(brainOutputs);
                }
                
                // Движение тела зависит от паттерна лап
                const leftLegs = this.legs.filter(l => l.side === 'left');
                const rightLegs = this.legs.filter(l => l.side === 'right');
                
                const leftAvg = leftLegs.reduce((sum, leg) => sum + leg.femur, 0) / 3;
                const rightAvg = rightLegs.reduce((sum, leg) => sum + leg.femur, 0) / 3;
                
                // Поворот
                this.bodyAngle += (rightAvg - leftAvg) * 0.001;
                
                // Движение вперед
                this.bodyX += Math.cos(this.bodyAngle) * 0.5;
                this.bodyY += Math.sin(this.bodyAngle) * 0.5;
                
                // Голова следит за движением
                this.headAngle = this.bodyAngle + Math.sin(Date.now() * 0.01) * 0.1;
            }
            
            draw(ctx) {
                ctx.clearRect(0, 0, 400, 400);
                ctx.save();
                ctx.translate(this.bodyX, this.bodyY);
                ctx.rotate(this.bodyAngle);
                
                // Тело
                ctx.fillStyle = '#3a5a3a';
                ctx.strokeStyle = '#7cfc00';
                ctx.lineWidth = 3;
                
                // Брюшко
                ctx.beginPath();
                ctx.ellipse(0, 0, 30, 20, 0, 0, 2*Math.PI);
                ctx.fill();
                ctx.stroke();
                
                // Грудь
                ctx.beginPath();
                ctx.ellipse(20, 0, 25, 18, 0, 0, 2*Math.PI);
                ctx.fill();
                ctx.stroke();
                
                // Голова (поворачивается отдельно)
                ctx.save();
                ctx.translate(45, 0);
                ctx.rotate(this.headAngle - this.bodyAngle);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 12, 0, 0, 2*Math.PI);
                ctx.fill();
                ctx.stroke();
                
                // Глаза
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(5, -4, 3, 0, 2*Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, 4, 3, 0, 2*Math.PI);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(7, -4, 1.5, 0, 2*Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(7, 4, 1.5, 0, 2*Math.PI);
                ctx.fill();
                
                // Усики
                ctx.strokeStyle = '#7cfc00';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(8, -6);
                ctx.lineTo(20, -15);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(8, 6);
                ctx.lineTo(20, 15);
                ctx.stroke();
                
                ctx.restore();
                
                // Лапы
                ctx.strokeStyle = '#7cfc00';
                ctx.lineWidth = 3;
                
                // Левая сторона
                for (let i = 0; i < 3; i++) {
                    const leg = this.legs[i];
                    const angles = leg.getAngles();
                    
                    const xOffset = -10 + i * 20;
                    
                    ctx.save();
                    ctx.translate(xOffset, 0);
                    
                    // Coxa (базовый сустав)
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(10, 5 + angles.coxa * 0.2);
                    
                    // Femur (средний)
                    ctx.lineTo(20 + angles.femur * 0.2, 15 + angles.femur * 0.3);
                    
                    // Tibia (нижний)
                    ctx.lineTo(30 + angles.tibia * 0.2, 25 + angles.tibia * 0.4);
                    
                    ctx.stroke();
                    ctx.restore();
                }
                
                // Правая сторона
                for (let i = 0; i < 3; i++) {
                    const leg = this.legs[i+3];
                    const angles = leg.getAngles();
                    
                    const xOffset = -10 + i * 20;
                    
                    ctx.save();
                    ctx.translate(xOffset, 0);
                    ctx.scale(1, -1);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(10, 5 + angles.coxa * 0.2);
                    ctx.lineTo(20 + angles.femur * 0.2, 15 + angles.femur * 0.3);
                    ctx.lineTo(30 + angles.tibia * 0.2, 25 + angles.tibia * 0.4);
                    
                    ctx.stroke();
                    ctx.restore();
                }
                
                ctx.restore();
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        const brainCanvas = document.getElementById('brainCanvas');
        const antCanvas = document.getElementById('antCanvas');
        const ctxBrain = brainCanvas.getContext('2d');
        const ctxAnt = antCanvas.getContext('2d');
        
        const brain = new AntBrain();
        const ant = new Ant();
        
        let time = 0;
        let gait = 'walk';
        
        // Создаем интерфейс для лап
        function updateLegUI() {
            const container = document.getElementById('legControls');
            let html = '';
            
            ant.legs.forEach((leg, i) => {
                const angles = leg.getAngles();
                const side = leg.side === 'left' ? '⬅️' : '➡️';
                const pos = ['передняя', 'средняя', 'задняя'][leg.position];
                
                html += `
                    <div class="leg-control">
                        <span class="leg-number">${side} ${pos}</span>
                        <div class="leg-bar">
                            <div class="leg-fill" id="legFill${i}" style="width: ${(angles.femur/180)*100}%"></div>
                        </div>
                        <span class="leg-angle">${Math.round(angles.femur)}°</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Отрисовка мозга
        function drawBrain() {
            ctxBrain.clearRect(0, 0, 600, 600);
            
            // Рисуем связи
            ctxBrain.strokeStyle = '#7cfc00';
            ctxBrain.lineWidth = 1;
            ctxBrain.globalAlpha = 0.3;
            
            for (let neuron of brain.neurons) {
                for (let out of neuron.outputs) {
                    if (out.synapse && out.synapse.post) {
                        ctxBrain.beginPath();
                        ctxBrain.moveTo(neuron.x, neuron.y);
                        ctxBrain.lineTo(out.synapse.post.x, out.synapse.post.y);
                        
                        // Цвет в зависимости от веса
                        const weight = out.synapse.weight;
                        if (weight > 0) {
                            ctxBrain.strokeStyle = `rgba(124, 252, 0, ${Math.abs(weight)})`;
                        } else {
                            ctxBrain.strokeStyle = `rgba(255, 0, 0, ${Math.abs(weight)})`;
                        }
                        
                        ctxBrain.stroke();
                    }
                }
            }
            
            // Рисуем нейроны
            ctxBrain.globalAlpha = 1;
            for (let neuron of brain.neurons) {
                // Цвет по типу
                switch(neuron.type) {
                    case 'sensory': ctxBrain.fillStyle = '#44f'; break;
                    case 'motor': ctxBrain.fillStyle = '#f44'; break;
                    case 'inter': ctxBrain.fillStyle = '#ff4'; break;
                    case 'command': ctxBrain.fillStyle = '#f4f'; break;
                }
                
                // Размер по активности
                let radius = 5;
                if (neuron.spiked) {
                    radius = 10;
                    ctxBrain.shadowBlur = 20;
                    ctxBrain.shadowColor = '#7cfc00';
                }
                
                ctxBrain.beginPath();
                ctxBrain.arc(neuron.x, neuron.y, radius, 0, 2*Math.PI);
                ctxBrain.fill();
                
                if (neuron.spiked) {
                    ctxBrain.strokeStyle = '#fff';
                    ctxBrain.lineWidth = 2;
                    ctxBrain.stroke();
                }
                
                ctxBrain.shadowBlur = 0;
                
                // ID для маленьких
                if (neuron.id.length < 10) {
                    ctxBrain.fillStyle = '#fff';
                    ctxBrain.font = '8px Courier New';
                    ctxBrain.fillText(neuron.id.split('_')[0], neuron.x-10, neuron.y-10);
                }
            }
            
            // Обновляем статистику
            const activityDiv = document.getElementById('brainActivity');
            let activityHtml = '';
            
            const neuronTypes = ['sensory', 'inter', 'motor', 'command'];
            neuronTypes.forEach(type => {
                const neurons = brain.neurons.filter(n => n.type === type);
                const active = neurons.filter(n => n.spiked).length;
                
                activityHtml += `
                    <div class="neuron-cell">
                        <span class="spike-indicator" style="background: ${active>0?'#7cfc00':'#444'}"></span>
                        ${type}: ${active}/${neurons.length}
                    </div>
                `;
            });
            
            activityDiv.innerHTML = activityHtml;
        }
        
        // Функции управления
        function setGait(newGait) {
            gait = newGait;
            document.getElementById('currentGait').textContent = newGait;
            
            // Подаем команды в мозг
            if (newGait === 'walk') {
                brain.step({walk: true});
            } else if (newGait === 'stop') {
                // Останавливаем
            }
        }
        
        function randomStimulus() {
            // Случайные тактильные стимулы
            const touch = new Array(6).fill(0);
            for (let i = 0; i < 3; i++) {
                touch[Math.floor(Math.random() * 6)] = Math.random();
            }
            brain.step({touch});
        }
        
        function resetBrain() {
            brain.neurons = [];
            brain.synapses = [];
            brain.time = 0;
            brain.createBrain();
            brain.connectBrain();
        }
        
        // Основной цикл
        function step() {
            time++;
            
            // Подаем текущую команду
            if (gait === 'walk') {
                brain.step({walk: true});
            } else if (gait === 'turnLeft') {
                // Стимуляция левых сенсоров
                const touch = new Array(6).fill(0);
                for (let i = 0; i < 3; i++) touch[i] = 0.5;
                brain.step({walk: true, touch});
            } else if (gait === 'turnRight') {
                const touch = new Array(6).fill(0);
                for (let i = 3; i < 6; i++) touch[i] = 0.5;
                brain.step({walk: true, touch});
            } else {
                brain.step({});
            }
            
            // Получаем моторные выходы
            const motorOutputs = brain.getMotorOutputs();
            
            // Обновляем муравья
            ant.update(motorOutputs);
            
            // Отрисовка
            drawBrain();
            ant.draw(ctxAnt);
            
            // Обновляем UI
            updateLegUI();
            
            // Статистика
            document.getElementById('time').textContent = time;
            
            const spikes = brain.neurons.filter(n => n.spiked).length;
            document.getElementById('spikeRate').textContent = spikes * 10; // за секунду
            
            requestAnimationFrame(step);
        }
        
        // Запуск
        updateLegUI();
        step();
    </script>
</body>
</html>
