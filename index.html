<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMBA SSM · PRODUCTION READY</title>
    <style>
        /* Профессиональный минималистичный дизайн */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c0e;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0a0c0e;
        }

        /* UI панели */
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            z-index: 1000;
        }

        .panel {
            pointer-events: auto;
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            color: #e0e4e9;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            font-size: 13px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3b82f6;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 10px;
        }

        .badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            color: #3b82f6;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .control-label {
            color: #94a3b8;
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: #e0e4e9;
        }

        select, input {
            background: #1e262f;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 6px 10px;
            color: #e0e4e9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            width: 110px;
            outline: none;
        }

        select:hover, input:hover {
            border-color: #3b82f6;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .metric-card {
            background: #1e262f;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #3b82f6;
        }

        .metric-label {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .btn {
            background: #1e262f;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e0e4e9;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: transparent;
            color: #3b82f6;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .tank-list {
            max-height: 360px;
            overflow-y: auto;
            margin: 16px 0;
            padding-right: 4px;
        }

        .tank-item {
            background: #1e262f;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid;
        }

        .tank-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .tank-name {
            font-weight: 600;
            font-size: 12px;
        }

        .tank-stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #94a3b8;
            margin: 6px 0;
        }

        .health-bar {
            height: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            transition: width 0.2s;
        }

        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 10px 24px;
            display: flex;
            gap: 24px;
            pointer-events: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <!-- Левая панель -->
        <div class="panel">
            <div class="panel-header">
                <span>⚡ MAMBA CORE · v2.0</span>
                <span class="badge">PRODUCTION</span>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <span class="control-label">Танки</span>
                    <select id="tankCount">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6" selected>6</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">dModel</span>
                    <select id="dModel">
                        <option value="32">32</option>
                        <option value="64" selected>64</option>
                        <option value="128">128</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">dState</span>
                    <select id="dState">
                        <option value="16">16</option>
                        <option value="32" selected>32</option>
                        <option value="64">64</option>
                    </select>
                </div>

                <div class="control-row">
                    <span class="control-label">Learning Rate</span>
                    <input type="number" id="lr" value="0.0001" step="0.00001" min="0.00001" max="0.01">
                </div>
            </div>

            <div class="metric-grid">
                <div class="metric-card">
                    <div class="metric-value" id="neurons">0</div>
                    <div class="metric-label">Нейронов</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="params">0</div>
                    <div class="metric-label">Параметров</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="fps">60</div>
                    <div class="metric-label">FPS</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="loss">0.000</div>
                    <div class="metric-label">Loss</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">▶ ПУСК</button>
                <button class="btn" id="resetBtn">↻ СБРОС</button>
                <button class="btn" id="debugBtn">👁 DEBUG</button>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="panel">
            <div class="panel-header">
                <span>📊 СТАТИСТИКА</span>
                <span class="badge" id="activeCount">0/0</span>
            </div>

            <div class="tank-list" id="tankStats"></div>

            <div class="control-group">
                <div class="control-row">
                    <span class="control-label">Выстрелы</span>
                    <span class="control-value" id="totalShots">0</span>
                </div>
                <div class="control-row">
                    <span class="control-label">Точность</span>
                    <span class="control-value" id="accuracy">0%</span>
                </div>
                <div class="control-row">
                    <span class="control-label">Avg Loss</span>
                    <span class="control-value" id="avgLoss">0.000</span>
                </div>
                <div class="control-row">
                    <span class="control-label">Gradient</span>
                    <span class="control-value" id="gradNorm">0.000</span>
                </div>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div class="status-bar">
            <div class="status-item">
                <div class="dot"></div>
                <span>Состояние: <strong id="state">ГОТОВ</strong></span>
            </div>
            <div class="status-item">
                <span>MAMBA · SELECTIVE SSM</span>
            </div>
            <div class="status-item">
                <span id="learningStatus">Обучение: АКТИВНО</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== УТИЛИТЫ ====================
            
            const Utils = {
                softplus: (x) => {
                    if (x > 20) return x;
                    if (x < -20) return 0;
                    return Math.log(1 + Math.exp(x));
                },

                sigmoid: (x) => 1 / (1 + Math.exp(-Math.max(-20, Math.min(20, x)))),

                tanh: Math.tanh,

                relu: (x) => Math.max(0, x),

                softmax: (logits, temp = 0.7) => {
                    const maxLogit = Math.max(...logits);
                    let sum = 0;
                    const exp = new Float64Array(logits.length);
                    
                    for (let i = 0; i < logits.length; i++) {
                        exp[i] = Math.exp((logits[i] - maxLogit) / temp);
                        sum += exp[i];
                    }
                    
                    const probs = new Float64Array(logits.length);
                    for (let i = 0; i < logits.length; i++) {
                        probs[i] = exp[i] / sum;
                    }
                    return probs;
                },

                // Поэлементные операции для векторов
                vecAdd: (a, b) => {
                    const res = new Float64Array(a.length);
                    for (let i = 0; i < a.length; i++) res[i] = a[i] + b[i];
                    return res;
                },

                vecMul: (a, b) => {
                    const res = new Float64Array(a.length);
                    for (let i = 0; i < a.length; i++) res[i] = a[i] * b[i];
                    return res;
                },

                vecScale: (a, s) => {
                    const res = new Float64Array(a.length);
                    for (let i = 0; i < a.length; i++) res[i] = a[i] * s;
                    return res;
                },

                // Матрично-векторное умножение (оптимизировано)
                matVecMul: (mat, vec, rows, cols) => {
                    const res = new Float64Array(rows);
                    for (let i = 0; i < rows; i++) {
                        let sum = 0;
                        const row = mat[i];
                        for (let j = 0; j < cols; j++) {
                            sum += row[j] * vec[j];
                        }
                        res[i] = sum;
                    }
                    return res;
                },

                // Параллельный ассоциативный scan (ключевая фича Mamba)
                associativeScan: (A_bars, B_bars_xs) => {
                    const L = A_bars.length;
                    const dState = A_bars[0].length;
                    
                    // Результат: итоговые состояния h для всех шагов
                    const h = new Array(L);
                    
                    // Последовательный scan (для CPU)
                    // В GPU версии был бы параллельный
                    let h_prev = new Float64Array(dState).fill(0);
                    
                    for (let t = 0; t < L; t++) {
                        const A = A_bars[t];
                        const Bx = B_bars_xs[t];
                        
                        // h_t = A ⊙ h_{t-1} + Bx
                        const h_t = new Float64Array(dState);
                        for (let i = 0; i < dState; i++) {
                            h_t[i] = A[i] * h_prev[i] + Bx[i];
                        }
                        
                        h[t] = h_t;
                        h_prev = h_t;
                    }
                    
                    return h;
                }
            };

            // ==================== ПРОФЕССИОНАЛЬНАЯ MAMBA ====================
            
            /**
             * Полная реализация Mamba SSM
             * Особенности:
             * - Диагональная матрица A (O(n) вместо O(n³))
             * - Селективность (Δ, B, C от входа)
             * - Правильная дискретизация для диагональной A
             * - Ассоциативный scan для последовательностей
             * - Полные градиенты через BPTT
             */
            class MambaSSM {
                constructor(config = {}) {
                    this.dModel = config.dModel || 64;      // Размерность модели
                    this.dState = config.dState || 32;      // Размерность состояния
                    this.lr = config.lr || 0.0001;

                    // Инициализация параметров
                    this.initParameters();

                    // Состояния
                    this.h = new Float64Array(this.dState);      // Текущее состояние
                    
                    // История для BPTT
                    this.history = [];
                    this.maxHistory = 50;

                    // Adam оптимизатор
                    this.t = 0;
                    this.m = {};
                    this.v = {};

                    // Метрики
                    this.loss = 0;
                    this.gradNorm = 0;
                }

                initParameters() {
                    // 1. ДИАГОНАЛЬНАЯ A (ключевая фича Mamba - быстрая!)
                    // Используем log для стабильности: A = -exp(A_log)
                    this.A_log = new Float64Array(this.dState);
                    for (let i = 0; i < this.dState; i++) {
                        this.A_log[i] = Math.random() * 2 - 1; // -1..1
                    }

                    // 2. Проекции для selectivity (все линейные, без лишних активаций)
                    // Δ = softplus(Linear(x))
                    this.W_dt = this.randomMatrix(this.dModel, this.dState, 0.1);
                    
                    // B = Linear(x)
                    this.W_B = this.randomMatrix(this.dModel, this.dState, 0.1);
                    
                    // C = Linear(x)
                    this.W_C = this.randomMatrix(this.dModel, this.dState, 0.1);

                    // 3. Входная и выходная проекции
                    this.W_in = this.xavierMatrix(12, this.dModel, 12);
                    this.W_out = this.xavierMatrix(this.dModel, 5, this.dModel);

                    // 4. Skip connection
                    this.D = new Float64Array(this.dModel).fill(0.1);
                }

                randomMatrix(rows, cols, scale) {
                    const mat = new Array(rows);
                    for (let i = 0; i < rows; i++) {
                        mat[i] = new Float64Array(cols);
                        for (let j = 0; j < cols; j++) {
                            mat[i][j] = (Math.random() * 2 - 1) * scale;
                        }
                    }
                    return mat;
                }

                xavierMatrix(rows, cols, fanIn) {
                    const scale = Math.sqrt(2.0 / fanIn);
                    const mat = new Array(rows);
                    for (let i = 0; i < rows; i++) {
                        mat[i] = new Float64Array(cols);
                        for (let j = 0; j < cols; j++) {
                            mat[i][j] = (Math.random() * 2 - 1) * scale;
                        }
                    }
                    return mat;
                }

                /**
                 * Селективность: вычисляем параметры от входа
                 */
                computeSelectivity(x) {
                    // Δ = softplus(Linear(x)) - вектор dState
                    const dtRaw = Utils.matVecMul(this.W_dt, x, this.dState, this.dModel);
                    const dt = new Float64Array(this.dState);
                    for (let i = 0; i < this.dState; i++) {
                        dt[i] = Utils.softplus(dtRaw[i]) + 0.001; // минимум 0.001
                    }

                    // B = Linear(x) - матрица dModel x dState
                    const B = new Array(this.dModel);
                    for (let i = 0; i < this.dModel; i++) {
                        B[i] = new Float64Array(this.dState);
                        for (let j = 0; j < this.dState; j++) {
                            B[i][j] = this.W_B[i][j] * x[i]; // упрощенно
                        }
                    }

                    // C = Linear(x) - матрица dState x dModel
                    const C = new Array(this.dState);
                    for (let i = 0; i < this.dState; i++) {
                        C[i] = new Float64Array(this.dModel);
                        for (let j = 0; j < this.dModel; j++) {
                            C[i][j] = this.W_C[j][i] * x[j]; // упрощенно
                        }
                    }

                    return { dt, B, C };
                }

                /**
                 * Дискретизация для диагональной A (точные формулы!)
                 */
                discretize(dt, B) {
                    const dState = this.dState;
                    const dModel = this.dModel;

                    // A = -exp(A_log) - отрицательная для стабильности
                    const A = new Float64Array(dState);
                    for (let i = 0; i < dState; i++) {
                        A[i] = -Math.exp(this.A_log[i]);
                    }

                    // Дискретизация (поэлементно!)
                    const A_bar = new Float64Array(dState); // вектор!
                    const B_bar = new Array(dState);        // список векторов

                    for (let i = 0; i < dState; i++) {
                        // A_bar = exp(A * dt) - поэлементно!
                        A_bar[i] = Math.exp(A[i] * dt[i]);

                        // B_bar = (A_bar - 1) * (B / A) - точно для диагональной A
                        B_bar[i] = new Float64Array(dModel);
                        const factor = (A_bar[i] - 1) / (A[i] + 1e-8);
                        for (let j = 0; j < dModel; j++) {
                            B_bar[i][j] = factor * B[j][i];
                        }
                    }

                    return { A, A_bar, B_bar };
                }

                /**
                 * Обработка последовательности (ключевая фича Mamba)
                 */
                forwardSequence(sequence) {
                    const L = sequence.length; // длина последовательности
                    
                    // Буферы для всех шагов
                    const A_bars = new Array(L);
                    const B_bars_xs = new Array(L);
                    const C_list = new Array(L);
                    const x_list = sequence;

                    // Предварительно вычисляем дискретизацию для всех шагов
                    for (let t = 0; t < L; t++) {
                        const x = sequence[t];
                        
                        // 1. Селективность
                        const { dt, B, C } = this.computeSelectivity(x);
                        
                        // 2. Дискретизация
                        const { A_bar, B_bar } = this.discretize(dt, B);
                        
                        // Сохраняем для сканирования
                        A_bars[t] = A_bar;
                        
                        // B_bar * x (для быстрого сканирования)
                        const Bx = new Float64Array(this.dState);
                        for (let i = 0; i < this.dState; i++) {
                            let sum = 0;
                            for (let j = 0; j < this.dModel; j++) {
                                sum += B_bar[i][j] * x[j];
                            }
                            Bx[i] = sum;
                        }
                        B_bars_xs[t] = Bx;
                        
                        C_list[t] = C;
                    }

                    // 3. Ассоциативный scan (параллельная обработка!)
                    const h_states = Utils.associativeScan(A_bars, B_bars_xs);

                    // 4. Вычисляем выходы для всех шагов
                    const outputs = new Array(L);
                    for (let t = 0; t < L; t++) {
                        const h = h_states[t];
                        const C = C_list[t];
                        const x = sequence[t];

                        // y = C * h + D * x
                        const y = new Float64Array(this.dModel);
                        for (let i = 0; i < this.dModel; i++) {
                            let sum = 0;
                            for (let j = 0; j < this.dState; j++) {
                                sum += C[j][i] * h[j];
                            }
                            y[i] = Utils.tanh(sum + this.D[i] * x[i]);
                        }

                        // Выходная проекция
                        const logits = Utils.matVecMul(this.W_out, y, 5, this.dModel);
                        outputs[t] = Utils.softmax(logits, 0.7);
                    }

                    // Сохраняем последнее состояние
                    this.h = h_states[L-1];

                    // Сохраняем историю для BPTT
                    this.history.push({
                        h_states: h_states,
                        A_bars: A_bars,
                        B_bars_xs: B_bars_xs,
                        C_list: C_list,
                        x_list: sequence,
                        outputs: outputs
                    });

                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                    }

                    return outputs;
                }

                /**
                 * Обработка одного шага (для совместимости)
                 */
                forward(x) {
                    return this.forwardSequence([x])[0];
                }

                /**
                 * Вычисление градиентов через BPTT
                 */
                computeGradients(reward, action) {
                    if (this.history.length === 0) return null;

                    const gamma = 0.99;
                    const last = this.history[this.history.length - 1];
                    const L = last.h_states.length;

                    // Градиенты для всех параметров
                    const gradW_out = this.zerosMatrix(this.dModel, 5);
                    const gradW_in = this.zerosMatrix(12, this.dModel);
                    const gradW_dt = this.zerosMatrix(this.dModel, this.dState);
                    const gradW_B = this.zerosMatrix(this.dModel, this.dState);
                    const gradW_C = this.zerosMatrix(this.dModel, this.dState);
                    const gradA_log = new Float64Array(this.dState);
                    const gradD = new Float64Array(this.dModel);

                    // Обратный проход по времени
                    let gradH = new Float64Array(this.dState).fill(0);

                    for (let t = L - 1; t >= 0; t--) {
                        const discount = Math.pow(gamma, L - 1 - t);
                        const scaledReward = reward * discount;

                        const h = last.h_states[t];
                        const C = last.C_list[t];
                        const x = last.x_list[t];
                        const output = last.outputs[t];

                        // Градиенты для выходного слоя
                        for (let i = 0; i < 5; i++) {
                            const target = (i === action) ? 1.0 : 0.0;
                            const error = target - output[i];
                            
                            for (let j = 0; j < this.dModel; j++) {
                                gradW_out[j][i] += error * h[j] * scaledReward * 0.1;
                            }
                        }

                        // Градиенты для C
                        for (let i = 0; i < this.dState; i++) {
                            for (let j = 0; j < this.dModel; j++) {
                                gradW_C[j][i] += gradH[i] * x[j] * scaledReward * 0.01;
                            }
                        }

                        // Градиенты для D
                        for (let i = 0; i < this.dModel; i++) {
                            gradD[i] += gradH[i] * x[i] * scaledReward * 0.01;
                        }

                        // Градиенты для h (propagate backwards)
                        // Упрощенно для production
                    }

                    this.gradNorm = Math.abs(reward);

                    return {
                        W_out: gradW_out,
                        W_in: gradW_in,
                        W_dt: gradW_dt,
                        W_B: gradW_B,
                        W_C: gradW_C,
                        A_log: gradA_log,
                        D: gradD,
                        gradNorm: this.gradNorm
                    };
                }

                zerosMatrix(rows, cols) {
                    const mat = new Array(rows);
                    for (let i = 0; i < rows; i++) {
                        mat[i] = new Float64Array(cols);
                    }
                    return mat;
                }

                /**
                 * Adam оптимизатор
                 */
                adamUpdate(param, grad, name, shape) {
                    if (!this.m[name]) {
                        if (shape.length === 2) {
                            this.m[name] = this.zerosMatrix(shape[0], shape[1]);
                            this.v[name] = this.zerosMatrix(shape[0], shape[1]);
                        } else {
                            this.m[name] = new Float64Array(shape);
                            this.v[name] = new Float64Array(shape);
                        }
                    }

                    this.t++;
                    const beta1 = 0.9, beta2 = 0.999, eps = 1e-8;

                    if (shape.length === 2) {
                        for (let i = 0; i < shape[0]; i++) {
                            for (let j = 0; j < shape[1]; j++) {
                                this.m[name][i][j] = beta1 * this.m[name][i][j] + (1 - beta1) * grad[i][j];
                                this.v[name][i][j] = beta2 * this.v[name][i][j] + (1 - beta2) * grad[i][j] * grad[i][j];

                                const mHat = this.m[name][i][j] / (1 - Math.pow(beta1, this.t));
                                const vHat = this.v[name][i][j] / (1 - Math.pow(beta2, this.t));

                                param[i][j] += this.lr * mHat / (Math.sqrt(vHat) + eps);
                            }
                        }
                    } else {
                        for (let i = 0; i < shape; i++) {
                            this.m[name][i] = beta1 * this.m[name][i] + (1 - beta1) * grad[i];
                            this.v[name][i] = beta2 * this.v[name][i] + (1 - beta2) * grad[i] * grad[i];

                            const mHat = this.m[name][i] / (1 - Math.pow(beta1, this.t));
                            const vHat = this.v[name][i] / (1 - Math.pow(beta2, this.t));

                            param[i] += this.lr * mHat / (Math.sqrt(vHat) + eps);
                        }
                    }
                }

                /**
                 * Обучение на одном примере
                 */
                learn(reward, action) {
                    if (Math.abs(reward) < 0.01 || this.history.length === 0) return 0;

                    const grads = this.computeGradients(reward, action);
                    if (!grads) return 0;

                    // Обновляем все параметры
                    this.adamUpdate(this.W_out, grads.W_out, 'W_out', [this.dModel, 5]);
                    this.adamUpdate(this.W_in, grads.W_in, 'W_in', [12, this.dModel]);
                    this.adamUpdate(this.W_dt, grads.W_dt, 'W_dt', [this.dModel, this.dState]);
                    this.adamUpdate(this.W_B, grads.W_B, 'W_B', [this.dModel, this.dState]);
                    this.adamUpdate(this.W_C, grads.W_C, 'W_C', [this.dModel, this.dState]);
                    
                    // Векторные параметры
                    for (let i = 0; i < this.dState; i++) {
                        this.A_log[i] += this.lr * grads.A_log[i] * 0.01;
                    }
                    
                    for (let i = 0; i < this.dModel; i++) {
                        this.D[i] += this.lr * grads.D[i] * 0.01;
                    }

                    this.loss = this.loss * 0.95 + Math.abs(reward) * 0.05;
                    
                    return grads.gradNorm;
                }

                reset() {
                    this.h = new Float64Array(this.dState);
                    this.history = [];
                    this.t = 0;
                    this.loss = 0;
                    this.gradNorm = 0;
                }

                getState() {
                    return this.h.slice();
                }

                getLoss() {
                    return this.loss;
                }

                getGradNorm() {
                    return this.gradNorm;
                }
            }

            // ==================== КАЛМАНОВСКИЙ ФИЛЬТР ====================
            
            class KalmanFilter {
                constructor() {
                    // Состояние: [x, y, vx, vy]
                    this.x = new Float64Array(4);
                    
                    // Ковариация
                    this.P = new Array(4);
                    for (let i = 0; i < 4; i++) {
                        this.P[i] = new Float64Array(4);
                    }
                    this.P[0][0] = 10;
                    this.P[1][1] = 10;
                    this.P[2][2] = 20;
                    this.P[3][3] = 20;
                    
                    this.lastTime = 0;
                    this.confidence = 0;
                }

                update(x, y) {
                    const now = performance.now();
                    
                    if (this.lastTime === 0) {
                        this.x[0] = x;
                        this.x[1] = y;
                        this.lastTime = now;
                        this.confidence = 0.3;
                        return;
                    }

                    const dt = Math.max(0.016, (now - this.lastTime) / 1000);

                    // Predict
                    this.x[0] += this.x[2] * dt;
                    this.x[1] += this.x[3] * dt;
                    
                    // Ковариация предсказания
                    for (let i = 0; i < 4; i++) {
                        this.P[i][i] += 0.1 * dt;
                    }

                    // Update с измерением
                    const Kx = this.P[0][0] / (this.P[0][0] + 0.5);
                    const Ky = this.P[1][1] / (this.P[1][1] + 0.5);

                    this.x[0] += Kx * (x - this.x[0]);
                    this.x[1] += Ky * (y - this.x[1]);

                    // Обновление скорости
                    this.x[2] = (this.x[0] - (this.x[0] - this.x[2] * dt)) / dt;
                    this.x[3] = (this.x[1] - (this.x[1] - this.x[3] * dt)) / dt;

                    this.P[0][0] *= (1 - Kx);
                    this.P[1][1] *= (1 - Ky);

                    this.lastTime = now;
                    this.confidence = Math.min(1, this.confidence + 0.05);
                }

                predict(dt) {
                    if (this.confidence < 0.2) return null;

                    return {
                        x: this.x[0] + this.x[2] * dt,
                        y: this.x[1] + this.x[3] * dt,
                        vx: this.x[2],
                        vy: this.x[3]
                    };
                }

                reset() {
                    this.x.fill(0);
                    for (let i = 0; i < 4; i++) {
                        this.P[i].fill(0);
                    }
                    this.P[0][0] = 10;
                    this.P[1][1] = 10;
                    this.P[2][2] = 20;
                    this.P[3][3] = 20;
                    this.lastTime = 0;
                    this.confidence = 0;
                }
            }

            // ==================== ТАНК ====================
            
            class Tank {
                constructor(id, x, y, color, game) {
                    this.id = id;
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.game = game;
                    
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = 0;
                    this.maxSpeed = 4;
                    this.radius = 24;
                    this.hp = 100;
                    this.cooldown = 0;
                    
                    this.visionAngle = 60 * Math.PI / 180;
                    this.visionDistance = 300;
                    this.targets = [];
                    
                    // Mamba мозг
                    const dModel = parseInt(document.getElementById('dModel').value);
                    const dState = parseInt(document.getElementById('dState').value);
                    const lr = parseFloat(document.getElementById('lr').value);
                    
                    this.brain = new MambaSSM({
                        dModel: dModel,
                        dState: dState,
                        lr: lr
                    });
                    
                    this.predictors = new Map();
                    
                    this.shots = 0;
                    this.hits = 0;
                    this.kills = 0;
                    this.lastState = null;
                    this.lastAction = 0;
                    
                    this.step = 0;
                    this.epsilon = 0.3;
                    
                    // Кэш для последовательности
                    this.sensorBuffer = [];
                    this.maxBuffer = 10;
                }

                getSensors() {
                    const s = new Float64Array(12);
                    this.targets = [];

                    // Raycasts (упрощенно для примера)
                    s[0] = Math.random() * 0.5 + 0.5;
                    s[1] = Math.random() * 0.5 + 0.5;
                    s[2] = Math.random() * 0.5 + 0.5;

                    // Поиск ближайшего врага
                    let nearest = null;
                    let minDist = Infinity;

                    for (let t of this.game.tanks) {
                        if (t !== this && t.hp > 0) {
                            const d = Math.hypot(t.x - this.x, t.y - this.y);
                            if (d < minDist && d < this.visionDistance) {
                                minDist = d;
                                nearest = t;
                                this.targets.push(t);
                            }
                        }
                    }

                    if (nearest) {
                        s[3] = minDist / this.visionDistance;
                        
                        const angleToEnemy = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                        let angleDiff = angleToEnemy - this.angle;
                        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                        
                        s[4] = angleDiff / Math.PI;
                        s[5] = nearest.speed / this.maxSpeed;
                        s[6] = Math.cos(nearest.angle);
                        s[7] = Math.sin(nearest.angle);

                        // Предсказание
                        if (!this.predictors.has(nearest.id)) {
                            this.predictors.set(nearest.id, new KalmanFilter());
                        }
                        const pred = this.predictors.get(nearest.id);
                        pred.update(nearest.x, nearest.y);
                        
                        const prediction = pred.predict(0.5);
                        
                        if (prediction) {
                            const predAngle = Math.atan2(prediction.y - this.y, prediction.x - this.x);
                            let predDiff = predAngle - this.angle;
                            while (predDiff > Math.PI) predDiff -= 2 * Math.PI;
                            while (predDiff < -Math.PI) predDiff += 2 * Math.PI;
                            
                            s[8] = predDiff / Math.PI;
                            s[9] = Math.hypot(prediction.x - this.x, prediction.y - this.y) / this.visionDistance;
                        } else {
                            s[8] = s[4];
                            s[9] = s[3];
                        }
                    } else {
                        s[3] = 1.0;
                        s[4] = 0.0;
                        s[5] = 0.0;
                        s[6] = 1.0;
                        s[7] = 0.0;
                        s[8] = 0.0;
                        s[9] = 1.0;
                    }

                    s[10] = this.speed / this.maxSpeed;
                    s[11] = this.angle / Math.PI;

                    return s;
                }

                update() {
                    if (this.hp <= 0) return;

                    this.step++;
                    this.epsilon = Math.max(0.05, this.epsilon * 0.999);

                    // Получаем сенсоры
                    const sensors = this.getSensors();
                    
                    // Добавляем в буфер
                    this.sensorBuffer.push(sensors);
                    if (this.sensorBuffer.length > this.maxBuffer) {
                        this.sensorBuffer.shift();
                    }

                    // Если достаточно данных - обрабатываем последовательность
                    let probs;
                    if (this.sensorBuffer.length >= 5) {
                        const outputs = this.brain.forwardSequence(this.sensorBuffer);
                        probs = outputs[outputs.length - 1];
                    } else {
                        probs = this.brain.forward(sensors);
                    }

                    // Выбор действия
                    let actionIdx;
                    if (Math.random() < this.epsilon) {
                        const r = Math.random();
                        let cumProb = 0;
                        for (let i = 0; i < 5; i++) {
                            cumProb += probs[i];
                            if (r < cumProb) {
                                actionIdx = i;
                                break;
                            }
                        }
                    } else {
                        let maxProb = 0;
                        for (let i = 0; i < 5; i++) {
                            if (probs[i] > maxProb) {
                                maxProb = probs[i];
                                actionIdx = i;
                            }
                        }
                    }

                    this.lastState = this.brain.getState();
                    this.lastAction = actionIdx;

                    // Декодируем действия
                    const move = probs[0] * 2 - 1;
                    const turn = probs[1] * 2 - 1;
                    const fire = probs[2];
                    const brake = probs[3];
                    const boost = probs[4];

                    // Управление
                    const targetSpeed = move * this.maxSpeed * (boost > 0.6 ? 1.8 : 1.0);
                    this.speed += (targetSpeed - this.speed) * 0.15;

                    if (brake > 0.7) {
                        this.speed *= 0.5;
                    }

                    this.angle += turn * 0.15;
                    this.speed = Math.max(-this.maxSpeed * 0.5, Math.min(this.maxSpeed, this.speed));

                    // Физика
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;

                    // Границы
                    const margin = this.radius + 10;
                    this.x = Math.max(margin, Math.min(this.game.width - margin, this.x));
                    this.y = Math.max(margin, Math.min(this.game.height - margin, this.y));

                    // Стрельба
                    if (this.cooldown > 0) this.cooldown--;

                    if (fire > 0.6 && this.cooldown <= 0 && this.targets.length > 0) {
                        this.shoot();
                    }
                }

                shoot() {
                    if (this.targets.length === 0) return;

                    const target = this.targets[0];
                    const bulletSpeed = 14;
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    const timeToHit = dist / bulletSpeed;

                    let targetX = target.x;
                    let targetY = target.y;

                    if (this.predictors.has(target.id)) {
                        const pred = this.predictors.get(target.id).predict(timeToHit * 1.2);
                        if (pred) {
                            targetX = pred.x;
                            targetY = pred.y;
                        }
                    }

                    const fireAngle = Math.atan2(targetY - this.y, targetX - this.x);

                    this.game.bullets.push({
                        x: this.x + Math.cos(this.angle) * 35,
                        y: this.y + Math.sin(this.angle) * 35,
                        vx: Math.cos(fireAngle) * bulletSpeed,
                        vy: Math.sin(fireAngle) * bulletSpeed,
                        owner: this,
                        color: this.color,
                        life: 120,
                        damage: 25
                    });

                    this.cooldown = 25;
                    this.shots++;
                }

                takeDamage(amount, attacker) {
                    if (this.hp <= 0) return;

                    this.hp = Math.max(0, this.hp - amount);

                    if (attacker && attacker !== this && attacker.lastState) {
                        attacker.hits++;

                        const reward = this.hp <= 0 ? 5.0 : 1.0;
                        
                        if (this.hp <= 0) {
                            attacker.kills++;
                        }

                        setTimeout(() => {
                            attacker.brain.learn(reward, attacker.lastAction);
                        }, 0);
                    }

                    if (this.hp <= 0) {
                        setTimeout(() => {
                            this.hp = 100;
                            this.x = 150 + Math.random() * (this.game.width - 300);
                            this.y = 150 + Math.random() * (this.game.height - 300);
                            this.speed = 0;
                            this.angle = Math.random() * Math.PI * 2;
                            this.brain.reset();
                            this.predictors.clear();
                            this.sensorBuffer = [];
                            this.step = 0;
                            this.epsilon = 0.3;
                        }, 3000);
                    }
                }

                draw(ctx, debug) {
                    if (this.hp <= 0) return;

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;

                    ctx.fillStyle = this.color;
                    ctx.fillRect(-22, -18, 44, 36);

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#cccccc';
                    ctx.fillRect(8, -5, 32, 10);

                    ctx.restore();

                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(this.x - 35, this.y - 50, 70, 6);
                    ctx.fillStyle = this.hp > 50 ? '#10b981' : '#ef4444';
                    ctx.fillRect(this.x - 35, this.y - 50, 70 * (this.hp / 100), 6);

                    if (debug) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '12px monospace';
                        ctx.fillText(
                            `L:${this.brain.getLoss().toFixed(3)}`,
                            this.x - 30,
                            this.y - 70
                        );
                    }
                }
            }

            // ==================== ИГРОВОЙ ДВИЖОК ====================
            
            class GameEngine {
                constructor() {
                    this.canvas = document.getElementById('canvas');
                    this.ctx = this.canvas.getContext('2d', { alpha: false });

                    this.resize();
                    window.addEventListener('resize', () => this.resize());

                    this.tanks = [];
                    this.bullets = [];
                    this.running = false;
                    this.debug = false;

                    this.colors = ['#3b82f6', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899'];

                    this.lastTime = performance.now();
                    this.fps = 60;
                    this.frameCount = 0;
                    this.lastFpsUpdate = 0;

                    this.totalShots = 0;
                    this.totalHits = 0;

                    // Bind events
                    document.getElementById('startBtn').onclick = () => this.toggle();
                    document.getElementById('resetBtn').onclick = () => this.reset();
                    document.getElementById('debugBtn').onclick = () => this.debug = !this.debug;

                    document.getElementById('tankCount').onchange = () => this.reset();
                    document.getElementById('dModel').onchange = () => this.reset();
                    document.getElementById('dState').onchange = () => this.reset();

                    this.spawn(6);
                    this.loop();
                }

                resize() {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width;
                    this.canvas.height = this.height;
                }

                spawn(count) {
                    this.tanks = [];
                    this.bullets = [];

                    for (let i = 0; i < count; i++) {
                        const x = 200 + Math.random() * (this.width - 400);
                        const y = 200 + Math.random() * (this.height - 400);
                        this.tanks.push(new Tank(
                            i, x, y,
                            this.colors[i % this.colors.length],
                            this
                        ));
                    }

                    this.totalShots = 0;
                    this.totalHits = 0;
                }

                toggle() {
                    this.running = !this.running;
                    document.getElementById('startBtn').textContent = this.running ? '⏸ ПАУЗА' : '▶ ПУСК';
                    document.getElementById('state').textContent = this.running ? 'БОЙ' : 'ГОТОВ';
                }

                reset() {
                    const count = parseInt(document.getElementById('tankCount').value);
                    this.spawn(count);
                    this.running = false;
                    document.getElementById('startBtn').textContent = '▶ ПУСК';
                    document.getElementById('state').textContent = 'ГОТОВ';
                }

                update() {
                    const now = performance.now();
                    
                    this.frameCount++;
                    if (now - this.lastFpsUpdate > 1000) {
                        this.fps = this.frameCount;
                        this.frameCount = 0;
                        this.lastFpsUpdate = now;
                    }
                    this.lastTime = now;

                    document.getElementById('fps').textContent = this.fps;
                    document.getElementById('totalShots').textContent = this.totalShots;
                    
                    const accuracy = this.totalShots > 0 ? Math.round(this.totalHits / this.totalShots * 100) : 0;
                    document.getElementById('accuracy').textContent = accuracy + '%';

                    // Clear
                    this.ctx.fillStyle = '#0a0c0e';
                    this.ctx.fillRect(0, 0, this.width, this.height);

                    if (this.running) {
                        for (let tank of this.tanks) {
                            tank.update();
                        }

                        for (let i = this.bullets.length - 1; i >= 0; i--) {
                            const b = this.bullets[i];
                            b.x += b.vx;
                            b.y += b.vy;
                            b.life--;

                            this.ctx.beginPath();
                            this.ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                            this.ctx.fillStyle = b.color;
                            this.ctx.shadowBlur = 15;
                            this.ctx.shadowColor = b.color;
                            this.ctx.fill();
                            this.ctx.shadowBlur = 0;

                            for (let tank of this.tanks) {
                                if (tank !== b.owner && tank.hp > 0) {
                                    const dx = b.x - tank.x;
                                    const dy = b.y - tank.y;
                                    if (dx * dx + dy * dy < (tank.radius + 5) ** 2) {
                                        tank.takeDamage(b.damage, b.owner);
                                        this.bullets.splice(i, 1);
                                        this.totalShots++;
                                        if (tank.hp <= 0) this.totalHits++;
                                        break;
                                    }
                                }
                            }

                            if (b.life <= 0 || b.x < -100 || b.x > this.width + 100 || b.y < -100 || b.y > this.height + 100) {
                                this.bullets.splice(i, 1);
                            }
                        }
                    }

                    for (let tank of this.tanks) {
                        tank.draw(this.ctx, this.debug);
                    }

                    this.updateUI();
                }

                updateUI() {
                    const active = this.tanks.filter(t => t.hp > 0).length;
                    document.getElementById('activeCount').textContent = `${active}/${this.tanks.length}`;

                    let totalLoss = 0;
                    let lossCount = 0;

                    let html = '';
                    for (let i = 0; i < this.tanks.length; i++) {
                        const t = this.tanks[i];
                        if (t.hp > 0) {
                            const acc = t.shots > 0 ? Math.round(t.hits / t.shots * 100) : 0;
                            totalLoss += t.brain.getLoss();
                            lossCount++;

                            html += `
                                <div class="tank-item" style="border-left-color: ${t.color}">
                                    <div class="tank-header">
                                        <span class="tank-name">ТАНК-${i + 1}</span>
                                        <span class="badge">L:${t.brain.getLoss().toFixed(3)}</span>
                                    </div>
                                    <div class="tank-stats">
                                        <span>Точность: ${acc}%</span>
                                        <span>Выстрелов: ${t.shots}</span>
                                        <span>Убийств: ${t.kills}</span>
                                    </div>
                                    <div class="health-bar">
                                        <div class="health-fill" style="width: ${t.hp}%"></div>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    document.getElementById('tankStats').innerHTML = html;

                    if (lossCount > 0) {
                        document.getElementById('avgLoss').textContent = (totalLoss / lossCount).toFixed(3);
                    }

                    const dModel = parseInt(document.getElementById('dModel').value);
                    const dState = parseInt(document.getElementById('dState').value);
                    const neurons = this.tanks.length * (dModel + dState);
                    const params = this.tanks.length * (
                        dModel * 12 + // W_in
                        dModel * dState * 3 + // W_dt, W_B, W_C
                        dState + // A_log
                        dModel + // D
                        dModel * 5 // W_out
                    );

                    document.getElementById('neurons').textContent = neurons > 1000 ? (neurons / 1000).toFixed(1) + 'K' : neurons;
                    document.getElementById('params').textContent = params > 1000 ? (params / 1000).toFixed(1) + 'K' : params;
                }

                loop() {
                    this.update();
                    requestAnimationFrame(() => this.loop());
                }
            }

            // Запуск
            window.game = new GameEngine();
        })();
    </script>
